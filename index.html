<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corretor PSS1 · Matemática 2026</title><style>

main{max-width:940px;margin:auto;padding:8px}.pane{background:white;border:1px solid #dce3ed;border-radius:12px;padding:10px;margin-bottom:8px}
nav{display:flex;gap:5px;overflow:auto;margin-bottom:8px}nav button{flex:1;white-space:nowrap}

</style></head><body>
<header><h1>Corretor PSS1</h1></header>
<main><nav><button id="tabCorrect" class="active" type="button">Corrigir</button><button id="tabGrades" type="button">Boletim</button><button id="tabStats" type="button">Estatísticas</button><button id="tabConfig" type="button">Planilha</button></nav>
<section id="correct">
<div class="pane"><div class="row"><button id="qrButton" type="button">Ler QR Code</button><button id="cardButton" type="button" class="secondary">Ler cartão</button></div>
<video id="qrVideo" class="video hide" playsinline autoplay muted></video>
<div class="row" style="margin-top:12px"><label>Turma<select id="group"><option value="1A">1º A</option><option value="1B">1º B</option></select></label><label>Aluno<select id="student"></select></label></div>
<div id="studentMeta"></div><div id="message"></div></div>
<div class="pane"><div class="row"><span class="summary" id="total">0,00 / 10,00</span></div>
<div id="questions"></div>
<div class="row" style="margin-top:14px"><button id="save" class="positive">Salvar nota</button><button id="clear" class="secondary">Limpar marcações</button><button id="reset" class="danger">Resetar nota do aluno</button></div>
<div id="resetMsg"></div></div></section>
<section id="grades" class="hide"><div class="pane"><div class="row"><label>Turma<select id="gradeGroup"><option value="1A">1º A</option><option value="1B">1º B</option></select></label><button id="refresh">Atualizar planilha</button></div><div style="overflow:auto"><table id="gradeTable"></table></div></div></section>
<section id="stats" class="hide"><div class="pane"><h3>Resumo de correções</h3><div id="statsOut"></div></div></section>
<section id="config" class="hide"><div class="pane"><h3>Conexão com Google Sheets</h3><div id="connection">Planilha ainda não verificada</div><p style="font-size:13px">Informe uma vez a URL /exec do Apps Script; ela fica armazenada neste aparelho.</p><input id="gas" type="url" placeholder="https://script.google.com/macros/s/.../exec">
<div class="row" style="margin-top:10px"><button id="saveUrl">Salvar URL</button><button id="checkUrl" class="secondary">Verificar</button><button id="sync" class="secondary">Sincronizar</button></div>
<p id="sheetsMessage"></p></div></section>
</main>
<script>
"use strict";
const ROSTERS = {
  "1A": [
    {num:1,name:"ALESSANDRO DE LIMA MAINARDES",type:"A"},{num:2,name:"ALEXSANDRO PACHECO ANDRADE",type:"B"},
    {num:3,name:"ANTHONY GABRIEL SILVA DE OLIVEIRA",type:"C"},{num:4,name:"CARLOS EDUARDO CAMARGO DA SILVA",type:"A"},
    {num:5,name:"CLEVERSON KAUAN COSTA",type:"B"},{num:6,name:"DEIVID BERNARDO DE LARA RODRIGUES",type:"C"},
    {num:7,name:"DHIENYFER APARECIDA CAMARGO VIEIRA",type:"A"},{num:8,name:"DOUGLAS DE SOUZA KOCH",type:"B"},
    {num:9,name:"GABRIEL PACHECO PINHEIRO",type:"C"},{num:10,name:"JOÃO CARLOS MARTINS BUENO",type:"A"},
    {num:11,name:"JOAO MANOEL CASTANHO MATSUMOTO",type:"B"},{num:12,name:"JOAO PEDRO AMARAL",type:"C"},
    {num:13,name:"LUIS FELIPE CARDOSO DE SOUZA",type:"A"},{num:16,name:"MILENA DE OLIVEIRA MARTINS",type:"B"},
    {num:17,name:"NÁTHALY VITÓRIA BIAZIN OLEIAS",type:"C"},{num:18,name:"PIETRO HAVI KUKI AZEVEDO E SILVA",type:"A"},
    {num:22,name:"JOAO PAULO RAMOS DOS SANTOS",type:"B"},{num:23,name:"GUSTAVO DOS SANTOS LEAL",type:"C"},
    {num:24,name:"THAIS ARRUDA LEITE",type:"A"},{num:27,name:"HANA EDUARDA DOS SANTOS MONTEIRO DE OLIVEIRA",type:"B"},
    {num:28,name:"VICTOR ENRIQUE SANTOS SILVA",type:"C"}
  ],
  "1B": [
    {num:1,name:"ANA FLAVIA SOARES DE AGOSTINHO",type:"A"},{num:2,name:"ANA LORENA TELES DINIZ",type:"B"},
    {num:3,name:"ANDERSON GABRIEL SCHINEGOWSKI CIARÁ",type:"C"},{num:4,name:"ANDREY ALVES ANDRADE",type:"A"},
    {num:5,name:"EMANUELLY DA SILVA VIEIRA",type:"B"},{num:6,name:"EMANUELY NAYARA ROBERTO DOS PASSOS",type:"C"},
    {num:7,name:"GRAZIELLY MILEK DOS SANTOS",type:"A"},{num:8,name:"GUSTAVO TOZESKI OLIVEIRA",type:"B"},
    {num:9,name:"HELENA VALENTIM GUIMARAES",type:"C"},{num:10,name:"JOAO PEDRO SOARES DA SILVA",type:"A"},
    {num:11,name:"KAREN CRISTINA BATISTA DA SILVA",type:"B"},{num:12,name:"KAUÃ HENRIQUE DOS SANTOS",type:"C"},
    {num:13,name:"LUIZ FELIPE DA ROCHA DA SILVA",type:"A"},{num:14,name:"NATHIELLY VITORIA DOS SANTOS LARA",type:"B"},
    {num:15,name:"SCHEILA SIMÕES",type:"C"},{num:16,name:"VINICIUS ROBERTO",type:"A"},
    {num:17,name:"WALACY RENAN GONÇALVES FERREIRA",type:"B"},{num:18,name:"WALESKA MARIELLY MAINARDES DE LIMA",type:"C"},
    {num:19,name:"YURI RAFAEL RAMOS DOS SANTOS",type:"A"},{num:21,name:"JULIO CESAR PILAT OLIVEIRA",type:"B"},
    {num:23,name:"MARIA EDUARDA GABRIELY DE SOUZA SBITIKOWSKI",type:"C"},{num:25,name:"FABIANA ELOA MACHADO DE OLIVEIRA",type:"A"},
    {num:26,name:"SOFIA KATARINE DE LIMA",type:"B"},{num:27,name:"LUIS RAFAEL ALBANO DE ALMEIDA",type:"C"},
    {num:28,name:"ADRIAN EMANUEL PACHECO LOURENÇO",type:"A"}
  ]
};

// Gabaritos oficiais PSS 1 (4 proposições: 01, 02, 04, 08 -> soma máxima 15) por Tipo A, B e C
const ANSWER_KEYS = {
  A: [11, 5, 14, 11, 13, 7, 14, 11, 13, 7],
  B: [13, 3, 7, 13, 11, 14, 11, 7, 14, 13],
  C: [7, 10, 11, 7, 14, 13, 7, 13, 11, 14]
};
const $=id=>document.getElementById(id);
const ZERO=()=>Array(10).fill(0),fmt=n=>Number(n).toFixed(2).replace('.',',');
const DB_KEY='pss1_2026_db',QUEUE_KEY='pss1_2026_queue',DRAFT_KEY='pss1_2026_drafts',GAS_KEY='pss1_2026_gas_url',IMPORT_KEY='pss1_omr_pending';
function readStorage(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch(e){return fallback}}
let db=readStorage(DB_KEY,{'1A':{},'1B':{}}),queue=readStorage(QUEUE_KEY,[]),drafts=readStorage(DRAFT_KEY,{}),gasUrl=localStorage.getItem(GAS_KEY)||'';
let marks=ZERO(),dirty=false,remoteVersion=0,sending=false,resetting=false,qrStream=null,qrTimer=null,qrBusy=false,currentTab='correct';
function persist(){localStorage.setItem(DB_KEY,JSON.stringify(db));localStorage.setItem(QUEUE_KEY,JSON.stringify(queue))}
function score(mask,key){
 if(!mask||(mask&(~key))!==0)return 0;
 let right=0,picked=0;for(let b=0;b<4;b++){if((key>>b)&1)right++;if((mask>>b)&1)picked++}
 return right?Math.round(picked/right*100)/100:0;
}
function current(){const t=$('group').value,n=Number($('student').value);return {t,n,st:(ROSTERS[t]||[]).find(a=>a.num===n)}}
function draftId(t,n){return t+'|'+n}
function saveDraft(){const {t,n}=current();drafts[draftId(t,n)]=marks.slice();localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts))}
function discardDraft(t,n){delete drafts[draftId(t,n)];localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts))}
function getMarks(){return marks.slice()}
function calculated(t,st,vals){const scores=vals.map((v,i)=>score(v,ANSWER_KEYS[st.type][i]));return {scores,total:Math.round(scores.reduce((a,b)=>a+b,0)*100)/100}}
function toast(m){$('message').textContent=m}
function showTab(name){
 currentTab=name;for(const k of ['correct','grades','stats','config']){$(k).classList.toggle('hide',k!==name)}
 for(const [id,k] of [['tabCorrect','correct'],['tabGrades','grades'],['tabStats','stats'],['tabConfig','config']])$(id).classList.toggle('active',k===name);
 if(name==='grades')renderGrades();if(name==='stats')renderStats();
}
function groupChange(selected){
 const t=$('group').value,sel=$('student'),before=selected??Number(sel.value);
 sel.replaceChildren();
 ROSTERS[t].forEach(s=>{const o=document.createElement('option');o.value=s.num;o.textContent=String(s.num).padStart(2,'0')+' - '+s.name;sel.append(o)});
 if((ROSTERS[t]||[]).some(s=>s.num===before))sel.value=String(before);
 studentChange();
}
function studentChange(){
 const {t,n,st}=current();if(!st)return;
 const saved=db[t]?.[n],draft=drafts[draftId(t,n)];
 marks=Array.isArray(draft)&&draft.length===10?draft.slice():(Array.isArray(saved?.marks)&&saved.marks.length===10?saved.marks.slice():ZERO());
 dirty=Array.isArray(draft);
 const queued=queue.some(r=>r.turma===t&&Number(r.num)===n);
 const stText=saved?(queued?'Salva neste celular; aguardando planilha':(saved.confirmed?'Corrigida no Google Sheets':'Salva no celular')):'Pendente';
 $('studentMeta').textContent=st.name+' · Tipo '+st.type+' · '+stText;
 renderQuestions();
}
function renderQuestions(){
 const {st}=current();if(!st)return;
 const host=$('questions');host.replaceChildren();
 let total=0;
 marks.forEach((m,q)=>{
  const points=score(m,ANSWER_KEYS[st.type][q]);total+=points;
  const row=document.createElement('div');row.className='question';
  const label=document.createElement('div');label.className='qname';label.textContent='Q'+String(q+1).padStart(2,'0');
  const sub=document.createElement('small');sub.textContent='Soma '+String(m).padStart(2,'0');label.append(sub);
  const choices=document.createElement('div');choices.className='choices';
  for(const w of [1,2,4,8]){
   const button=document.createElement('button');button.className='choice'+((m&w)?' selected':'');button.type='button';button.textContent=String(w).padStart(2,'0');
   button.setAttribute('aria-pressed',Boolean(m&w));
   button.onclick=()=>{marks[q]^=w;dirty=true;saveDraft();renderQuestions()};choices.append(button);
  }
  const right=document.createElement('div');right.className='score';right.textContent=fmt(points);
  row.append(label,choices,right);host.append(row);
 });
 $('total').textContent=fmt(total)+' / 10,00';
}
function clearDraft(){marks=ZERO();dirty=true;saveDraft();renderQuestions();toast('Marcações zeradas e mantidas assim após atualizar. Para excluir uma nota salva, use Resetar nota do aluno.')}
function refreshStatus(){
 const count=queue.length;$('connection').textContent=count?'Envio pendente: '+count+' nota(s)':remoteVersion?'Planilha acessível':'Planilha não verificada';
}
function parseScores(row){
 const scores=Array.from({length:10},(_,i)=>Number(String(row['Q'+String(i+1).padStart(2,'0')]??'').replace(',','.')));
 return scores.every(x=>Number.isFinite(x)&&x>=0&&x<=1)?scores:null;
}
async function getSheet(){
 if(!gasUrl)throw Error('URL do Apps Script não configurada.');
 const u=new URL(gasUrl);u.searchParams.set('action','data');u.searchParams.set('_',String(Date.now()));
 const r=await fetch(u.toString(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);
 const j=await r.json();if(j.status!=='ok'||!j.turmas||!Array.isArray(j.turmas['1A'])||!Array.isArray(j.turmas['1B']))throw Error(j.message||'O Apps Script não devolveu as turmas.');
 remoteVersion=Number(j.version)||1;refreshStatus();return j;
}
async function reconcile({notify=true}={}){
 try{
  const remote=await getSheet();let verified=0,conflicts=0;
  for(const t of ['1A','1B'])for(const row of remote.turmas[t]){
   const n=Number(row['Nº']),st=ROSTERS[t].find(x=>x.num===n),pending=queue.find(x=>x.turma===t&&Number(x.num)===n);
   if(!st||row.Tipo!==st.type)continue;
   if(row.Status!=='Corrigida'){
    if(!pending)delete db[t][n];continue; // servidor é fonte de verdade
   }
   const scores=parseScores(row);if(!scores)continue;
   const stored=db[t][n];
   if(pending&&(!stored||scores.some((v,i)=>Math.abs(v-pending.scores[i])>.011))){conflicts++;continue}
   if(pending){queue=queue.filter(x=>!(x.turma===t&&Number(x.num)===n));verified++}
   db[t][n]={turma:t,num:n,name:st.name,type:st.type,marks:stored?.marks||ZERO(),scores,total:Math.round(scores.reduce((a,b)=>a+b,0)*100)/100,confirmed:true,updatedAt:String(row.Atualizado_Em||'')};
  }
  persist();refreshStatus();
  // Só atualizar o rascunho se não houver alterações feitas pelo professor.
  const {t,n}=current();if(!dirty&&db[t]?.[n])marks=db[t][n].marks.slice();
  renderQuestions();renderGrades();renderStats();
  studentStatusOnly();
  if(notify)$('sheetsMessage').textContent='Planilha atualizada. '+verified+' lançamento(s) confirmado(s).'+(conflicts?' '+conflicts+' divergência(s) preservada(s).':'');
  return remote;
 }catch(e){if(notify)$('sheetsMessage').textContent='Não foi possível consultar a planilha: '+String(e.message||e);throw e}
}
function studentStatusOnly(){
 const {t,n,st}=current();if(!st)return;
 const saved=db[t][n],pending=queue.some(x=>x.turma===t&&Number(x.num)===n);
 $('studentMeta').textContent=st.name+' · Tipo '+st.type+' · '+(pending?'Aguardando sincronização':saved?(saved.confirmed?'Corrigida no Google Sheets':'Salva no celular'):'Pendente');
}
async function sync(){
 if(sending)return;
 if(!gasUrl){$('sheetsMessage').textContent='Configure a URL do Apps Script.';return}
 sending=true;
 try{
  let remote=await getSheet();
  for(const record of queue.slice()){
   const row=(remote.turmas[record.turma]||[]).find(r=>Number(r['Nº'])===record.num);
   if(row&&row.Status==='Corrigida'){
    const vals=parseScores(row);
    if(vals&&vals.every((x,i)=>Math.abs(x-record.scores[i])<.011)){
     queue=queue.filter(q=>!(q.turma===record.turma&&q.num===record.num));if(db[record.turma]?.[record.num])db[record.turma][record.num].confirmed=true;continue;
    }
    // Substituição explicitamente permitida no clique Salvar do aluno.
    if(!record.replace){$('sheetsMessage').textContent='Nota diferente já existe no Sheets para '+record.turma+' nº '+record.num+'.';continue}
   }
   const reply=await fetch(gasUrl,{method:'POST',body:JSON.stringify({records:[record]}),redirect:'follow'});
   if(!reply.ok)throw Error('HTTP '+reply.status);
   const result=await reply.json();if(result.status==='error'||result.status==='partial'||result.status!=='ok'||result.updated===0)throw Error(result.message||'Gravação não confirmada pelo Apps Script.');
   remote=await getSheet();
   const saved=(remote.turmas[record.turma]||[]).find(r=>Number(r['Nº'])===record.num),scores=saved&&parseScores(saved);
   if(saved?.Status!=='Corrigida'||!scores||scores.some((x,i)=>Math.abs(x-record.scores[i])>.011))throw Error('A planilha não confirmou as mesmas notas por questão.');
   queue=queue.filter(q=>!(q.turma===record.turma&&q.num===record.num));if(db[record.turma]?.[record.num])db[record.turma][record.num].confirmed=true;
  }
  persist();studentStatusOnly();renderGrades();refreshStatus();$('sheetsMessage').textContent='Sincronização concluída.';
 }catch(e){$('sheetsMessage').textContent='Sem confirmação da planilha: '+String(e.message||e)+'. Nota mantida no celular.'}
 finally{sending=false;refreshStatus()}
}
async function save(){
 const {t,n,st}=current();if(!st)return;
 const calc=calculated(t,st,marks),prior=db[t]?.[n];
 const replacing=Boolean(prior||queue.some(x=>x.turma===t&&x.num===n));
 if(replacing&&!confirm('Substituir a nota existente de '+st.name+' por '+fmt(calc.total)+'?'))return;
 const rec={turma:t,num:n,name:st.name,type:st.type,marks:getMarks(),scores:calc.scores,total:calc.total,updatedAt:new Date().toISOString(),replace:replacing};
 db[t][n]={...rec,confirmed:false};queue=queue.filter(x=>!(x.turma===t&&x.num===n));queue.push(rec);
 persist();discardDraft(t,n);dirty=false;studentStatusOnly();refreshStatus();toast('Salvo no celular. Conferindo gravação no Sheets…');
 await sync();if(!queue.some(x=>x.turma===t&&x.num===n))toast('Nota '+fmt(calc.total)+' confirmada no Google Sheets.');
}
async function resetStudent(){
 if(resetting||sending)return;
 const {t,n,st}=current();if(!st)return;
 if(!confirm('Excluir a nota salva de '+st.name+' ('+t+', nº '+n+') e voltar para Pendente?'))return;
 if(!gasUrl){$('resetMsg').textContent='Reset não realizado: falta a URL da planilha.';return}
 resetting=true;$('reset').disabled=true;$('resetMsg').textContent='Excluindo a nota no Google Sheets…';
 try{
  const sheet=await getSheet();
  if(remoteVersion<4)throw Error('A implantação do Apps Script ainda não possui o comando de reset. É necessário atualizar a implantação para a versão 4.');
  const response=await fetch(gasUrl,{method:'POST',body:JSON.stringify({action:'reset',scope:'student',turma:t,num:n,confirmed:true}),redirect:'follow'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const result=await response.json();
  if(result.status!=='ok'||result.action!=='reset'||!result.reset?.some(x=>x.turma===t&&Number(x.num)===n))throw Error(result.message||'O serviço não confirmou o reset.');
  const after=await getSheet();
  const row=(after.turmas[t]||[]).find(r=>Number(r['Nº'])===n);
  if(!row||row.Status!=='Pendente')throw Error('A planilha não confirmou o status Pendente. O reset local foi cancelado.');
  delete db[t][n];queue=queue.filter(x=>!(x.turma===t&&x.num===n));persist();discardDraft(t,n);
  localStorage.removeItem(IMPORT_KEY);marks=ZERO();dirty=false;renderQuestions();studentStatusOnly();renderGrades();renderStats();refreshStatus();
  $('resetMsg').textContent='Nota excluída no aplicativo e no Google Sheets. Aluno Pendente.';
 }catch(e){$('resetMsg').textContent='Não foi possível resetar: '+String(e.message||e)+'. A nota local não foi excluída.'}
 finally{resetting=false;$('reset').disabled=false}
}
async function openQr(){
 if(qrStream){closeQr();return}
 if(!navigator.mediaDevices?.getUserMedia){toast('Este navegador não permite a câmera nesta página. Selecione o aluno pela lista.');return}
 try{
  qrBusy=false;qrStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});
  const v=$('qrVideo');v.srcObject=qrStream;v.classList.remove('hide');await v.play();
  $('qrButton').textContent='Fechar câmera';
  let detector=null,jsqr=null,qrCanvas=null;
  if('BarcodeDetector' in window){
   try{detector=new BarcodeDetector({formats:['qr_code']})}catch(e){}
  }
  if(!detector){
   toast('Preparando leitor QR para este navegador…');
   const loader=document.createElement('script');
   loader.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
   loader.async=true;
   loader.onload=()=>{jsqr=window.jsQR;qrCanvas=document.createElement('canvas');toast('Leitor QR preparado. Aponte a câmera para o código.')};
   loader.onerror=()=>toast('QR automático indisponível neste navegador. Selecione o aluno na lista.');
   document.head.append(loader);
  }
  qrTimer=setInterval(async()=>{
   if(qrBusy||!qrStream)return;
   qrBusy=true;
   try{
    let raw=null;
    if(detector){const codes=await detector.detect(v);raw=codes[0]?.rawValue}
    else if(jsqr&&qrCanvas&&v.videoWidth&&v.videoHeight){
     qrCanvas.width=v.videoWidth;qrCanvas.height=v.videoHeight;
     const c=qrCanvas.getContext('2d',{willReadFrequently:true});c.drawImage(v,0,0,qrCanvas.width,qrCanvas.height);
     raw=jsqr(c.getImageData(0,0,qrCanvas.width,qrCanvas.height).data,qrCanvas.width,qrCanvas.height)?.data;
    }
    if(raw){
     const parts=String(raw).trim().split('|');
     if(parts[0]==='PSS1'&&['1A','1B'].includes(parts[1])){
      const n=Number(parts[2]),st=ROSTERS[parts[1]].find(a=>a.num===n);
      if(st&&st.type===parts[3]){closeQr();$('group').value=parts[1];groupChange(n);openCard(true)}
     }
    }
   }catch(e){}finally{qrBusy=false}
  },650);
 }catch(e){closeQr();toast('Erro de câmera: '+String(e.message||e))}
}
function closeQr(){
 if(qrTimer!==null){clearInterval(qrTimer);qrTimer=null}
 if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null}
 const v=$('qrVideo');v.pause();v.srcObject=null;v.classList.add('hide');$('qrButton').textContent='Ler QR Code';
}
function openCard(fromQr=false){
 const {t,n,st}=current();if(!st)return;
 closeQr();
 // Após o QR, abrir o leitor automaticamente; o navegador pode solicitar novo consentimento.
 location.href='scanner.html?turma='+encodeURIComponent(t)+'&num='+n+'&tipo='+st.type+'&v=20261118b';
}
function renderGrades(){
 const t=$('gradeGroup').value,table=$('gradeTable');
 table.innerHTML='<thead><tr><th>Nº</th><th>Aluno</th><th>Tipo</th><th>Status</th><th>Nota</th></tr></thead>';
 const body=document.createElement('tbody');
 for(const st of ROSTERS[t]){const rec=db[t]?.[st.num],tr=document.createElement('tr');
  for(const value of [String(st.num).padStart(2,'0'),st.name,st.type,rec?(rec.confirmed?'Corrigida':'Local'):'Pendente',rec?fmt(rec.total):'—']){
   const td=document.createElement('td');td.textContent=value;tr.append(td)}
  body.append(tr)
 }
 table.append(body);
}
function renderStats(){
 const items=Object.values(db['1A']).concat(Object.values(db['1B']));
 const confirmed=items.filter(i=>i.confirmed),sum=confirmed.reduce((a,r)=>a+r.total,0);
 $('statsOut').innerHTML='<div class="stat">Total de estudantes: 46</div><div class="stat">Provas confirmadas na planilha: '+confirmed.length+'</div><div class="stat">Média das corrigidas: '+(confirmed.length?fmt(sum/confirmed.length):'—')+'</div>';
}
function importOmr(){
 const raw=localStorage.getItem(IMPORT_KEY);if(!raw)return;
 localStorage.removeItem(IMPORT_KEY);
 try{const rec=JSON.parse(raw),t=rec.turma,n=Number(rec.num),st=ROSTERS[t]?.find(s=>s.num===n);
  if(!st||st.type!==rec.tipo||!Array.isArray(rec.marks)||rec.marks.length!==10||rec.marks.some(x=>!Number.isInteger(x)||x<0||x>15)){toast('Respostas do cartão inválidas.');return}
  $('group').value=t;groupChange(n);marks=rec.marks.slice();dirty=true;saveDraft();renderQuestions();toast('Respostas importadas. Confira os quadradinhos e toque em Salvar nota.');
 }catch(e){toast('Não foi possível importar a leitura do cartão.')}
}
function exportCsv(){
 const t=$('gradeGroup').value,rows=[['Nº','Estudante','Tipo','Status','Nota']];
 ROSTERS[t].forEach(st=>{const rec=db[t][st.num];rows.push([st.num,st.name,st.type,rec?'Corrigida':'Pendente',rec?fmt(rec.total):''])});
 const csv=rows.map(row=>row.map(cell=>'"'+String(cell).replaceAll('"','""')+'"').join(';')).join('\n');
 const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PSS1_'+t+'.csv';a.click();URL.revokeObjectURL(a.href);
}
function hook(){
 $('tabCorrect').onclick=()=>showTab('correct');$('tabGrades').onclick=()=>showTab('grades');$('tabStats').onclick=()=>showTab('stats');$('tabConfig').onclick=()=>showTab('config');
 $('group').onchange=()=>groupChange();$('student').onchange=studentChange;$('qrButton').onclick=openQr;$('cardButton').onclick=()=>openCard(false);
 $('save').onclick=save;$('clear').onclick=clearDraft;$('reset').onclick=resetStudent;$('gradeGroup').onchange=renderGrades;$('refresh').onclick=()=>reconcile();
 $('gas').value=gasUrl;$('saveUrl').onclick=()=>{const val=$('gas').value.trim();if(val&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(val)){$('sheetsMessage').textContent='URL inválida';return}gasUrl=val;localStorage.setItem(GAS_KEY,val);$('sheetsMessage').textContent='URL salva. Verifique a conexão.'};
 $('checkUrl').onclick=()=>reconcile();$('sync').onclick=sync;
}
hook();groupChange();importOmr();renderGrades();renderStats();refreshStatus();
if(gasUrl)reconcile({notify:false}).then(()=>{if(queue.length)sync()}).catch(()=>{});
window.addEventListener('pagehide',closeQr);
</script></body></html>
