<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Leitura óptica PSS — dezenas e unidades</title><style>body{font:16px system-ui;background:#f1f5f9;color:#16243c;max-width:850px;margin:auto;padding:14px}section{background:white;padding:15px;border-radius:12px;margin-bottom:12px}button,input{font:inherit;padding:9px;border-radius:7px}button{background:#1e40af;color:white;border:0;margin:5px}canvas{width:100%;height:auto;touch-action:manipulation;border:1px solid #bbb}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #ddd}select{font:inherit}.warn{color:#a33}small{color:#536174}</style></head><body><h2>Leitor óptico PSS — cartão numérico</h2><section><strong id="aluno"></strong><p>Fotografe o cartão inteiro, incluindo as dez colunas, de frente e com boa luz. Clique em <strong>Ler 20 dígitos</strong>. O leitor encontra os contornos dos quadradinhos automaticamente, sem tocar na tela. Confira os resultados antes de enviar.</p><input type="file" id="foto" accept="image/*" capture="environment"><button id="autoModo">Automático (sem pontos)</button><button id="manualModo">Manual (4 pontos)</button><button id="recomecar">Refazer pontos</button><div id="estado">Selecione uma fotografia.</div></section><section><canvas id="cv"></canvas></section><section><button id="analisar">Ler 20 dígitos</button><div id="resultado"></div><button id="enviar" disabled>Enviar para correção (sem salvar nota)</button></section><script>
const qs=new URLSearchParams(location.search), turma=qs.get('turma'),num=Number(qs.get('num')),tipo=qs.get('tipo');
document.getElementById('aluno').textContent='Turma '+(turma||'?')+' · Nº '+(num||'?')+' · Tipo '+(tipo||'?');
const c=document.getElementById('cv'),cx=c.getContext('2d',{willReadFrequently:true}),foto=document.getElementById('foto'),estado=document.getElementById('estado'),resultado=document.getElementById('resultado');let points=[],answers=null,img=null,autoMode=true;


function draw(){
 if(img)cx.drawImage(img,0,0,c.width,c.height);
}
foto.onchange=()=>{
 const f=foto.files[0];if(!f)return;
 const url=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{
  const scale=Math.min(1,1800/i.width);
  c.width=Math.round(i.width*scale);c.height=Math.round(i.height*scale);
  img=i;answers=null;resultado.innerHTML='';
  document.getElementById('enviar').disabled=true;
  draw();estado.textContent='Imagem carregada. Toque em Ler 20 dígitos.';
  URL.revokeObjectURL(url);
 };
 i.src=url;
};
document.getElementById('autoModo').style.display='none';
document.getElementById('manualModo').style.display='none';
document.getElementById('recomecar').textContent='Reanalisar foto';
document.getElementById('recomecar').onclick=()=>{answers=null;resultado.innerHTML='';document.getElementById('enviar').disabled=true;draw();estado.textContent='Toque em Ler 20 dígitos.';};
function groupNumbers(values,gap){
 const gs=[];let g=[];
 for(const v of values){
  if(g.length && v-g[g.length-1]>gap){gs.push(g);g=[];}
  g.push(v);
 }
 if(g.length)gs.push(g);
 return gs.map(a=>a.reduce((s,n)=>s+n,0)/a.length);
}
function decode(){
 if(!img)throw Error('Selecione a foto do cartão.');
 draw();
 const w=c.width,h=c.height,pixel=cx.getImageData(0,0,w,h).data;
 if(w<450||h<450)throw Error('Imagem pequena. Use uma foto com maior resolução.');
 const bw=new Uint8Array(w*h);
 for(let k=0,n=0;k<pixel.length;k+=4,n++){
  const v=pixel[k]*.299+pixel[k+1]*.587+pixel[k+2]*.114;
  bw[n]=v<125?1:0;
 }
 // Procurar linhas verticais longas. O bloco das respostas contém
 // exatamente 20 bordas externas (duas por questão), todas à mesma altura.
 const candidates=[];
 const minRun=Math.floor(h*.13);
 for(let x=0;x<w;x++){
  let begin=-1,best=0,bestStart=0,bestEnd=0,gap=0;
  for(let y=0;y<h;y++){
   const isDark=bw[y*w+x];
   if(isDark){
    if(begin<0)begin=y;
    gap=0;
   }else if(begin>=0){
    gap++;
    if(gap>1){
     const last=y-gap+1,len=last-begin;
     if(len>best){best=len;bestStart=begin;bestEnd=last;}
     begin=-1;gap=0;
    }
   }
  }
  if(begin>=0 && h-begin>best){best=h-begin;bestStart=begin;bestEnd=h;}
  if(best>=minRun)candidates.push({x,start:bestStart,end:bestEnd,len:best});
 }
 if(candidates.length<20)throw Error('Não encontrei os contornos das dez colunas. Fotografe o bloco completo.');
 // Procurar o conjunto de 20 linhas paralelas com mesmo início e fim.
 // A tolerância cobre diferenças pequenas de compressão e perspectiva.
 const tol=Math.max(3,h*.012);
 let cluster=[];
 for(const seed of candidates){
  const group=candidates.filter(v=>Math.abs(v.start-seed.start)<=tol&&Math.abs(v.end-seed.end)<=tol);
  if(group.length>cluster.length)cluster=group;
 }
 if(cluster.length<20)throw Error('A foto está muito inclinada ou desfocada. Aproxime o celular e fotografe de frente.');
 const xs=groupNumbers(cluster.map(a=>a.x).sort((a,b)=>a-b),2);
 if(xs.length!==20)throw Error('Não foi possível separar as dez colunas. Use a foto inteira do cartão, sem reflexos.');
 const boxes=Array.from({length:10},(_,i)=>[xs[2*i],xs[2*i+1]]);
 const widths=boxes.map(b=>b[1]-b[0]),avgWidth=widths.reduce((a,b)=>a+b,0)/10;
 if(boxes.some(b=>b[1]-b[0]<avgWidth*.8||b[1]-b[0]>avgWidth*1.2)){
  throw Error('Os contornos das colunas não estão consistentes. Fotografe de frente.');
 }
 const top=Math.min(...cluster.map(a=>a.start));
 const bottom=Math.max(...cluster.map(a=>a.end));
 const height=bottom-top;
 const yFrom=Math.max(0,Math.floor(top+height*.04));
 const yTo=Math.min(h,Math.floor(bottom-height*.013));
 // Em cada linha horizontal, somar os traços superior/inferior dos quadradinhos
 // ao redor das dezenas e unidades. Esses traços se repetem 20 vezes.
 const bars=[];
 for(let y=yFrom;y<yTo;y++){
  let total=0;
  for(const [left,right] of boxes){
   const wd=right-left;
   for(const frac of [.30,.67]){
    const center=Math.round(left+frac*wd);
    const rad=Math.max(2,Math.round(wd*.085));
    for(let x=Math.max(0,center-rad);x<=Math.min(w-1,center+rad);x++)total+=bw[y*w+x];
   }
  }
  bars.push({y,total});
 }
 const maxBar=Math.max(...bars.map(v=>v.total));
 const rowBars=groupNumbers(bars.filter(v=>v.total>maxBar*.48).map(v=>v.y),2);
 if(rowBars.length!==20)throw Error('Não foi possível identificar as dez linhas de dígitos. Aproxime a câmera do cartão.');
 const centers=Array.from({length:10},(_,i)=>(rowBars[i*2]+rowBars[i*2+1])/2);
 const cellHeight=rowBars[1]-rowBars[0];
 function darkness(cx0,cy0,rx,ry){
  let black=0,total=0;
  for(let y=Math.max(0,Math.round(cy0-ry));y<=Math.min(h-1,Math.round(cy0+ry));y++)
   for(let x=Math.max(0,Math.round(cx0-rx));x<=Math.min(w-1,Math.round(cx0+rx));x++){
    black+=bw[y*w+x];total++;
   }
  return total?black/total:0;
 }
 const out=[];
 for(let q=0;q<10;q++){
  const [left,right]=boxes[q],wd=right-left;
  const parsed=[];
  for(const [frac,digits] of [[.30,2],[.67,10]]){
   const x=left+frac*wd;
   const scores=Array.from({length:digits},(_,digit)=>darkness(x,centers[digit],Math.max(2,wd*.07),Math.max(2,cellHeight*.29)));
   const ranked=scores.map((score,digit)=>({digit,score})).sort((a,b)=>b.score-a.score);
   parsed.push({digit:ranked[0].digit,score:ranked[0].score,margin:ranked[0].score-ranked[1].score,x});
  }
  const value=parsed[0].digit*10+parsed[1].digit;
  const reliable=value<=15&&parsed.every(z=>z.score>=.62&&z.margin>=.35);
  out.push({value,parsed,reliable});
 }
 // Mostrar no cartão os centros reais que foram examinados.
 draw();
 cx.lineWidth=Math.max(2,w/650);
 for(let q=0;q<10;q++){
  for(let col=0;col<2;col++){
   const d=out[q].parsed[col],y=centers[d.digit],rad=Math.max(3,widths[q]*.055);
   cx.strokeStyle=out[q].reliable?'#15803d':'#dc2626';
   cx.strokeRect(d.x-rad,y-rad,2*rad,2*rad);
  }
 }
 return out;
}
document.getElementById('analisar').onclick=()=>{
 let out;
 try{out=decode();}catch(e){
  answers=null;
  document.getElementById('enviar').disabled=true;
  resultado.innerHTML='<p class="warn">'+e.message+'</p>';
  estado.textContent='A leitura não foi concluída. Veja a mensagem abaixo.';
  return;
 }
 answers=out;
 let table='<table><tr><th>Questão</th><th>Dezena</th><th>Unidade</th><th>Soma</th><th>Leitura</th></tr>';
 for(let q=0;q<10;q++){
  const r=out[q];
  table+='<tr><td>Q'+String(q+1).padStart(2,'0')+'</td><td>'+r.parsed[0].digit+'</td><td>'+r.parsed[1].digit+'</td><td><input type="number" min="0" max="15" step="1" value="'+r.value+'" data-q="'+q+'" style="width:70px"></td><td class="'+(r.reliable?'':'warn')+'">'+(r.reliable?'Detectado':'Inseguro')+'</td></tr>';
 }
 table+='</table><p><small>Os contornos verdes mostram os quadradinhos analisados. Confira as somas antes de enviar.</small></p>';
 resultado.innerHTML=table;
 const all=out.every(v=>v.reliable);
 document.getElementById('enviar').disabled=!all;
 estado.textContent=all?'Leitura concluída. Confira os dez valores antes de enviar.':'Algumas marcações não foram identificadas com segurança. Faça uma foto mais nítida.';
};
document.getElementById('enviar').onclick=()=>{const inputs=[...resultado.querySelectorAll('input[data-q]')];if(inputs.length!==10)return;const marks=inputs.map(x=>Number(x.value));if(marks.some(v=>!Number.isInteger(v)||v<0||v>15)){alert('Corrija as respostas: devem ficar entre 00 e 15.');return;}if(!confirm('Conferiu visualmente as 10 respostas? Elas NÃO serão salvas até clicar Salvar no corretor.'))return;localStorage.setItem('pss1_omr_pending',JSON.stringify({turma,num,tipo,marks,timestamp:Date.now()}));location.href='index.html?omr=1';};
</script></body></html>
