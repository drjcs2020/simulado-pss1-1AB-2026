<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leitor PSS1 — respostas ao vivo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px system-ui,-apple-system,sans-serif;color:#15263d;background:#f1f5f9}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:#1e3a8a;color:#fff;font-weight:800;padding:12px 14px;touch-action:manipulation}
button:disabled{opacity:.4}button.secondary{background:#e8effa;color:#153d77;border:1px solid #ccd8e8}button.good{background:#147c48}
#camera{position:fixed;inset:0;width:100%;height:100dvh;background:#020509;overflow:hidden}
#video{display:block;width:100%;height:100%;object-fit:contain}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:auto;touch-action:manipulation}
#cameraTop{position:absolute;top:max(14px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:9px;align-items:center;z-index:5}
#exit{background:#152943ed;flex:none;padding:14px}
#student{font-size:13px;font-weight:800;background:#152943d9;color:#fff;padding:12px 10px;border-radius:9px;flex:1;text-align:right}
#progress{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 69px);left:12px;right:12px;color:white;font-weight:800;font-size:13px;text-shadow:0 1px 3px #000;background:#091d3699;padding:9px 12px;border-radius:9px;max-width:480px;z-index:5}
#reviewLive{position:absolute;top:69%;right:14px;background:#146a39;color:#fff;border:2px solid #a3fac0;border-radius:12px;min-width:165px;min-height:58px;z-index:6;box-shadow:0 4px 14px #0008}
#reviewPanel{max-width:780px;margin:0 auto;padding:12px 10px 24px}
#reviewPanel h1{font-size:18px;color:#193765;margin:0 0 3px}
#school{font-size:12px;color:#52677e;margin:0 0 12px}
#reviewMessage{padding:10px;border-radius:9px;background:#fff9e9;border:1px solid #f1d9ab;margin:8px 0 12px;font-size:13px}
#answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.question{background:#fff;border:1px solid #d1dbea;border-radius:12px;padding:10px}
.question .head{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:9px}
.question .sum{font-size:19px;color:#1e3a8a}
.bits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.bit{padding:12px 2px;background:white;color:#1b3e65;border:2px solid #9cacc5;border-radius:9px;min-width:0}
.bit.selected{color:#fff;background:#183d77;border-color:#183d77}
.zero{background:#e8effa;color:#153d77;padding:8px 6px;width:100%;margin-top:8px}
#actions{display:flex;gap:8px;margin-top:13px}
#actions button{flex:1;min-height:50px}
[hidden]{display:none!important}
@media (min-width:760px){#answers{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:360px){#reviewLive{right:8px;min-width:130px;font-size:13px}#student{font-size:11px}}
</style></head>
<body>
<main id="camera">
 <video id="video" muted autoplay playsinline webkit-playsinline></video>
 <canvas id="overlay"></canvas>
 <div id="cameraTop"><button id="exit" type="button">← Voltar</button><div id="student"></div></div>
 <div id="progress" role="status" aria-live="polite">Abrindo câmera…</div>
 <button id="reviewLive" type="button">Conferir respostas</button>
</main>
<section id="reviewPanel" hidden>
 <h1>Corretor PSS 1 — Matemática 2026</h1>
 <div id="school">Colégio Estadual Padre Nicolau Baltazar</div>
 <div id="reviewStudent"></div><div id="reviewMessage" role="status"></div>
 <div id="answers"></div>
 <div id="actions"><button id="resume" class="secondary" type="button">Retomar câmera</button>
 <button id="send" class="good" type="button" disabled>Usar respostas</button></div>
 <button id="return" class="secondary" type="button" style="width:100%;margin-top:8px">Voltar sem salvar</button>
</section>
<script>
'use strict';
const params=new URLSearchParams(location.search),turma=params.get('turma')||'',num=Number(params.get('num')),tipo=params.get('tipo')||'';
const $=id=>document.getElementById(id);
const video=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d');
const workerUrl='omr-live-decimal-worker.js?v=20261120-instant1';
const state={stream:null,worker:null,timer:null,inFlight:false,seq:0,token:0,
 results:null,markerPoints:null,markerCount:0,marks:Array(10).fill(null),edited:new Set(),signature:'',stableCount:0,lastError:'',mode:'camera',
 recentValues:Array(10).fill(null),recentCounts:Array(10).fill(0)};
$('student').textContent=turma+' · Nº '+String(num).padStart(2,'0')+' · Tipo '+tipo;
$('reviewStudent').textContent='Turma '+turma+' · Chamada '+String(num).padStart(2,'0')+' · Prova '+tipo;
const validIdentity=['1A','1B'].includes(turma)&&['A','B','C'].includes(tipo)&&Number.isSafeInteger(num)&&num>=1;
const processing=document.createElement('canvas');
function inform(text){$('progress').textContent=text}
function stopCamera(){
 if(state.timer){clearTimeout(state.timer);state.timer=null}
 if(state.stream){for(const track of state.stream.getTracks())track.stop();state.stream=null}
 video.pause();video.srcObject=null;state.inFlight=false;state.token++;
 if(state.worker){state.worker.terminate();state.worker=null}
}
function mapRect(){
 const w=video.videoWidth,h=video.videoHeight,vw=overlay.clientWidth,vh=overlay.clientHeight;
 if(!w||!h||!vw||!vh)return null;
 const scale=Math.min(vw/w,vh/h),aw=processing.width;
 return {left:(vw-w*scale)/2,top:(vh-h*scale)/2,scale:scale*w/aw};
}
function mapPoint(p){
 const rect=mapRect();if(!rect)return null;
 return {x:rect.left+p.x*rect.scale,y:rect.top+p.y*rect.scale};
}
function guideRect(){
 const viewportWidth=overlay.clientWidth,viewportHeight=overlay.clientHeight;
 const videoWidth=video.videoWidth,videoHeight=video.videoHeight;
 const scale=videoWidth&&videoHeight?Math.min(viewportWidth/videoWidth,viewportHeight/videoHeight):1;
 const visibleWidth=videoWidth?videoWidth*scale:viewportWidth;
 const visibleHeight=videoHeight?videoHeight*scale:viewportHeight;
 const visibleLeft=(viewportWidth-visibleWidth)/2,visibleTop=(viewportHeight-visibleHeight)/2;
 // Mesma proporção dos 4 marcadores na folha impressa: aprox. 1,52:1.
 const width=Math.min(visibleWidth*.86,visibleHeight*.59*1.52);
 const height=width/1.52;
 const x=visibleLeft+(visibleWidth-width)/2;
 const centerY=visibleTop+visibleHeight*.50;
 const y=Math.max(visibleTop+visibleHeight*.17,
             Math.min(centerY-height/2,visibleTop+visibleHeight*.80-height));
 return {x,y,width,height};
}
function drawGuide(){
 const rect=guideRect(),{x,y,width,height}=rect;
 const length=Math.min(34,Math.max(18,width*.09));
 ctx.save();
 ctx.strokeStyle='rgba(250,205,64,.62)';
 ctx.lineWidth=1.5;
 ctx.setLineDash([9,10]);
 ctx.strokeRect(x,y,width,height);
 ctx.setLineDash([]);
 for(const corner of [
  {x,y,dx:1,dy:1},
  {x:x+width,y,dx:-1,dy:1},
  {x,y:y+height,dx:1,dy:-1},
  {x:x+width,y:y+height,dx:-1,dy:-1}
 ]){
  ctx.beginPath();
  ctx.strokeStyle='#101b2b';
  ctx.lineWidth=7;
  ctx.moveTo(corner.x+corner.dx*length,corner.y);
  ctx.lineTo(corner.x,corner.y);
  ctx.lineTo(corner.x,corner.y+corner.dy*length);
  ctx.stroke();
  ctx.beginPath();
  ctx.strokeStyle='#ffcf45';
  ctx.lineWidth=4;
  ctx.moveTo(corner.x+corner.dx*length,corner.y);
  ctx.lineTo(corner.x,corner.y);
  ctx.lineTo(corner.x,corner.y+corner.dy*length);
  ctx.stroke();
 }
 ctx.restore();
 return rect;
}
function drawOverlay(){
 const w=overlay.clientWidth,h=overlay.clientHeight;
 if(overlay.width!==w||overlay.height!==h){overlay.width=w;overlay.height=h}
 ctx.clearRect(0,0,w,h);
 if(state.mode!=='camera')return;
 // Referências amarelas são SEMPRE visíveis, até com 0 marcadores encontrados.
 drawGuide();
 const points=state.markerPoints;
 if(points){
  const corners=Array.isArray(points)?points:Object.values(points).filter(p=>p&&typeof p.x==='number');
  for(const marker of corners){
   const p=mapPoint(marker);
   if(!p)continue;
   ctx.beginPath();
   ctx.strokeStyle='#28f183';ctx.lineWidth=4;
   ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.stroke();
  }
 }
 const result=state.results;
 if(!result?.corners||!result.boxes?.length)return;
 for(let q=0;q<10;q++){
  const entry=result.results[q],cols=entry?.columns||[];
  const finalValue=state.edited.has(q)?state.marks[q]:entry?.rawValue;
  for(let c=0;c<2;c++){
   const digit=finalValue===null||finalValue===undefined?null:c===0?Math.floor(finalValue/10):finalValue%10;
   if(digit===null)continue;
   const opt=cols[c]?.options?.find(p=>p.digit===digit);
   const p=opt?mapPoint(opt):null;if(!p)continue;
   ctx.beginPath();ctx.strokeStyle=finalValue>15?'#ff5555':'#20ec75';
   ctx.lineWidth=4;ctx.arc(p.x,p.y,Math.max(8,result.boxes[q].w*mapRect().scale*.075),0,Math.PI*2);ctx.stroke();
  }
 }
}
function guidanceFor(result){
 const count=Math.max(0,Math.min(4,Number(result?.markersFound)||0));
 if(count<4){
  if(count===0)return 'Aponte para o cartão completo · buscando respostas';
  return count+'/4 cantos · Alinhe os outros quadrados com o guia';
 }
 return result.error?'4/4 cantos · Ajuste levemente a distância':'4/4 cantos · Cartão localizado';
}
function applyReading(result){
 if(state.mode!=='camera')return;
 state.markerCount=Math.max(0,Math.min(4,Number(result?.markersFound)||0));
 state.markerPoints=result?.markerPoints||null;
 if(!result||result.error||result.markersFound!==4){
  state.results=null;state.signature='';state.stableCount=0;
  inform(guidanceFor(result));
  drawOverlay();return;
 }
 state.results=result;
 const values=result.results.map(r=>r.valid?r.value:null);
 const signature=values.join('|');
 state.stableCount=state.signature===signature?state.stableCount+1:1;
 state.signature=signature;
 // Show the FIRST confident reading immediately. Require repetition only
 // before changing a previously accepted value, preventing visual jitter.
 for(let q=0;q<10;q++){
  if(state.edited.has(q)||values[q]===null)continue;
  const value=values[q];
  if(state.recentValues[q]===value)state.recentCounts[q]++;
  else{state.recentValues[q]=value;state.recentCounts[q]=1}
  if(state.marks[q]===null||state.marks[q]===value||state.recentCounts[q]>=2)
   state.marks[q]=value;
 }
 const valid=values.filter(v=>v!==null).length;
 const bad=result.results.findIndex(r=>r.rawValue!==null&&r.rawValue!==undefined&&r.rawValue>15);
 inform(guidanceFor(result)+' · '+valid+'/10 respostas'+(bad>=0?' · Q'+String(bad+1).padStart(2,'0')+'='+result.results[bad].rawValue+' inválida':''));
 drawOverlay();
}
function schedule(ms){
 if(state.mode!=='camera'||!state.stream)return;
 state.timer=setTimeout(readFrame,ms);
}
function ensureWorker(){
 if(state.worker)return state.worker;
 const worker=new Worker(workerUrl);state.worker=worker;
 worker.onmessage=event=>{
  const msg=event.data||{};if(msg.id!==state.seq||state.mode!=='camera')return;
  state.inFlight=false;
  if(msg.status==='ok')applyReading(msg.result);
  else inform('Erro na leitura: '+String(msg.message||'processamento'));
  schedule(65);
 };
 worker.onerror=e=>{
  state.inFlight=false;
  inform('Falha no leitor. Reiniciando…');
  try{state.worker?.terminate()}catch(_){}
  state.worker=null;schedule(900);
 };
 return worker;
}
function readFrame(){
 if(state.mode!=='camera'||!state.stream)return;
 if(state.inFlight){schedule(60);return}
 if(!video.videoWidth||!video.videoHeight||video.readyState<2){schedule(330);return}
 const scale=Math.min(640/video.videoWidth,720/video.videoHeight,1);
 const width=Math.max(240,Math.round(video.videoWidth*scale));
 const height=Math.max(180,Math.round(video.videoHeight*scale));
 // Avoid reallocating the canvas on every camera frame.
 if(processing.width!==width)processing.width=width;
 if(processing.height!==height)processing.height=height;
 try{
  const p=processing.getContext('2d',{willReadFrequently:true});
  p.drawImage(video,0,0,processing.width,processing.height);
  const image=p.getImageData(0,0,processing.width,processing.height);
  state.inFlight=true;
  const id=++state.seq;
  ensureWorker().postMessage({action:'analyze',id,width:processing.width,height:processing.height,pixels:image.data.buffer},[image.data.buffer]);
 }catch(err){
  state.inFlight=false;inform('Falha ao ler câmera: '+String(err.message||err).slice(0,90));schedule(800);
 }
}
async function startCamera(){
 stopCamera();
 state.mode='camera';$('reviewPanel').hidden=true;$('camera').hidden=false;
 state.results=null;state.markerPoints=null;state.markerCount=0;state.signature='';state.stableCount=0;
 state.recentValues.fill(null);state.recentCounts.fill(0);
 drawOverlay();inform('Abrindo câmera…');
 if(!validIdentity){inform('Identificação inválida. Volte e leia o QR da prova.');return}
 try{
  if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('O navegador requer HTTPS para abrir a câmera');
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  if(state.mode!=='camera'){stream.getTracks().forEach(t=>t.stop());return}
  state.stream=stream;video.srcObject=stream;await video.play();
  inform('Aponte para o cartão completo');
  readFrame();
 }catch(e){
  inform(e?.name==='NotAllowedError'?'Autorize a câmera nas permissões do navegador':String(e?.message||e));
 }
}
function scoreText(n){return n===null?'—':String(n).padStart(2,'0')}
function renderAnswers(){
 const parent=$('answers');parent.replaceChildren();
 for(let q=0;q<10;q++){
  const wrap=document.createElement('section');wrap.className='question';
  const head=document.createElement('div');head.className='head';
  const name=document.createElement('span');name.textContent='Q'+String(q+1).padStart(2,'0');
  const value=document.createElement('span');value.className='sum';value.textContent=scoreText(state.marks[q]);
  head.append(name,value);wrap.append(head);
  const choices=document.createElement('div');choices.className='bits';
  for(const bit of [1,2,4,8]){
   const control=document.createElement('button');control.type='button';control.className='bit'+(state.marks[q]!==null&&(state.marks[q]&bit)?' selected':'');
   control.textContent=String(bit).padStart(2,'0');
   control.onclick=()=>{state.marks[q]=(state.marks[q]??0)^bit;state.edited.add(q);renderAnswers()};
   choices.append(control);
  }
  wrap.append(choices);
  const zero=document.createElement('button');zero.type='button';zero.className='zero';
  zero.textContent='00 · zerar';zero.onclick=()=>{state.marks[q]=0;state.edited.add(q);renderAnswers()};wrap.append(zero);
  parent.append(wrap);
 }
 const remaining=state.marks.filter(x=>x===null).length;
 $('reviewMessage').textContent=remaining?
  'Faltam '+remaining+' respostas. Confira os valores e complete tocando em 01, 02, 04 e 08.':
  'Dez somatórias completas. Confira antes de enviar para a nota.';
 $('send').disabled=!validIdentity||remaining>0||state.marks.some(n=>!Number.isInteger(n)||n<0||n>15);
}
function review(){
 if(state.mode!=='camera')return;
 // Ao tocar Conferir, aproveita as respostas do último quadro analisado,
 // mesmo que ainda não tenham sido repetidas por dois frames.
 if(state.results?.results?.length===10){
  state.results.results.forEach((entry,q)=>{
   if(!state.edited.has(q)&&state.marks[q]===null&&entry.valid)state.marks[q]=entry.value;
  });
 }
 stopCamera();state.mode='review';
 $('camera').hidden=true;$('reviewPanel').hidden=false;
 renderAnswers();
 window.scrollTo(0,0);
}
function goHome(){
 stopCamera();location.href='index.html?v=20261120-instant1';
}
$('reviewLive').onclick=review;
$('exit').onclick=goHome;
$('return').onclick=goHome;
$('resume').onclick=()=>{state.edited.clear();startCamera()};
$('send').onclick=()=>{
 if($('send').disabled)return;
 if(!confirm('Confirmar as dez somatórias do aluno '+num+', turma '+turma+'?'))return;
 try{
  localStorage.setItem('pss1_omr_pending',JSON.stringify({turma,num,tipo,marks:state.marks.slice(),source:'live-camera',timestamp:Date.now()}));
  goHome();
 }catch(e){$('reviewMessage').textContent='Não foi possível guardar as respostas: '+String(e.message||e)}
};
overlay.addEventListener('pointerdown',event=>{
 const result=state.results,rect=mapRect();
 if(!result||!rect)return;
 const bx=event.clientX-overlay.getBoundingClientRect().left;
 const by=event.clientY-overlay.getBoundingClientRect().top;
 const px=(bx-rect.left)/rect.scale,py=(by-rect.top)/rect.scale;
 let nearest=null;
 for(let q=0;q<10;q++)for(let c=0;c<2;c++){
  const opts=result.results[q]?.columns[c]?.options||[];
  for(const option of opts){
   const dist=(option.x-px)**2+(option.y-py)**2;
   if(!nearest||dist<nearest.dist)nearest={q,c,digit:option.digit,dist};
  }
 }
 const maxDistance=Math.max(8,Math.abs(result.corners.tr.x-result.corners.tl.x)*.016);
 if(!nearest||nearest.dist>maxDistance**2)return;
 const {q,c,digit}=nearest;
 const original=state.marks[q]??result.results[q].rawValue??0;
 const next=c===0?digit*10+(original%10):Math.floor(original/10)*10+digit;
 if(next>15){inform('Soma '+next+' inválida: o máximo é 15');return}
 state.marks[q]=next;state.edited.add(q);
 drawOverlay();inform('Q'+String(q+1).padStart(2,'0')+' = '+scoreText(next)+' · toque Conferir respostas');
});
window.addEventListener('pagehide',stopCamera);
startCamera();
</script></body></html>
