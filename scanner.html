<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Leitura óptica PSS — dezenas e unidades</title><style>body{font:16px system-ui;background:#f1f5f9;color:#16243c;max-width:850px;margin:auto;padding:14px}section{background:white;padding:15px;border-radius:12px;margin-bottom:12px}button,input{font:inherit;padding:9px;border-radius:7px}button{background:#1e40af;color:white;border:0;margin:5px}canvas{width:100%;height:auto;touch-action:manipulation;border:1px solid #bbb}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #ddd}select{font:inherit}.warn{color:#a33}small{color:#536174}</style></head><body><h2>Leitor óptico PSS — cartão numérico</h2><section><strong id="aluno"></strong><p>1. Fotografe a terceira página inteira, com boa luz e sem reflexos. 2. Toque, nesta ordem, o centro de quatro bolinhas da grade: <b>Q01 dezena 0</b>, <b>Q01 unidade 9</b>, <b>Q10 unidade 9</b>, <b>Q10 dezena 0</b>. 3. Confira cada resposta antes de enviar.</p><input type="file" id="foto" accept="image/*" capture="environment"><button id="recomecar">Refazer pontos</button><div id="estado">Selecione uma fotografia.</div></section><section><canvas id="cv"></canvas></section><section><button id="analisar">Ler 20 dígitos</button><div id="resultado"></div><button id="enviar" disabled>Enviar para correção (sem salvar nota)</button></section><script>
const qs=new URLSearchParams(location.search), turma=qs.get('turma'),num=Number(qs.get('num')),tipo=qs.get('tipo');
document.getElementById('aluno').textContent='Turma '+(turma||'?')+' · Nº '+(num||'?')+' · Tipo '+(tipo||'?');
const c=document.getElementById('cv'),cx=c.getContext('2d',{willReadFrequently:true}),foto=document.getElementById('foto'),estado=document.getElementById('estado'),resultado=document.getElementById('resultado');let points=[],answers=null,img=null;
const labels=['Q01: dezena 0','Q01: unidade 9','Q10: unidade 9','Q10: dezena 0'];
function draw(){if(!img)return;cx.drawImage(img,0,0,c.width,c.height);cx.lineWidth=Math.max(2,c.width/450);points.forEach((p,i)=>{cx.beginPath();cx.strokeStyle='#dc2626';cx.arc(p.x,p.y,c.width/100,0,Math.PI*2);cx.stroke();cx.fillStyle='#dc2626';cx.font=(c.width/45)+'px sans-serif';cx.fillText(String(i+1),p.x+12,p.y-12)});}
foto.onchange=()=>{const f=foto.files[0];if(!f)return;const url=URL.createObjectURL(f),i=new Image();i.onload=()=>{const scale=Math.min(1,1800/i.width);c.width=Math.round(i.width*scale);c.height=Math.round(i.height*scale);img=i;points=[];answers=null;document.getElementById('enviar').disabled=true;draw();estado.textContent='Toque: '+labels[0];URL.revokeObjectURL(url)};i.src=url};
document.getElementById('recomecar').onclick=()=>{points=[];answers=null;draw();estado.textContent='Toque: '+labels[0];};
c.onclick=e=>{if(!img||points.length===4)return;const r=c.getBoundingClientRect();points.push({x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height});draw();estado.textContent=points.length===4?'Pronto para analisar.':'Toque: '+labels[points.length];};
function xy(col,row){const u=col/19,v=row/9,[a,b,d,e]=points;return{x:(1-u)*(1-v)*a.x+u*(1-v)*b.x+u*v*d.x+(1-u)*v*e.x,y:(1-u)*(1-v)*a.y+u*(1-v)*b.y+u*v*d.y+(1-u)*v*e.y};}
function density(data,x,y,r){let dark=0,total=0;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy>r*r)continue;let xx=Math.round(x+dx),yy=Math.round(y+dy);if(xx<0||yy<0||xx>=c.width||yy>=c.height)continue;let k=(yy*c.width+xx)*4;let gray=(data[k]+data[k+1]+data[k+2])/3;if(gray<140)dark++;total++;}return total?dark/total:0;}
document.getElementById('analisar').onclick=()=>{if(points.length!==4){estado.textContent='Primeiro marque os quatro pontos da grade.';return;}draw();const pix=cx.getImageData(0,0,c.width,c.height).data;const pitch=Math.hypot(points[1].x-points[0].x,points[1].y-points[0].y)/19,r=Math.max(2,Math.round(pitch*.28));answers=[];let html='<table><tr><th>Questão</th><th>Dezena</th><th>Unidade</th><th>Soma</th><th>Conferência</th></tr>';for(let row=0;row<10;row++){let pair=[],uncertain=false;for(let group=0;group<2;group++){let vals=[];for(let d=0;d<10;d++){const p=xy(group*10+d,row);vals.push(density(pix,p.x,p.y,r));}const sorted=vals.map((v,d)=>({v,d})).sort((a,b)=>b.v-a.v);pair.push(sorted[0].d);if(sorted[0].v<.34||sorted[0].v-sorted[1].v<.16)uncertain=true;}let sum=pair[0]*10+pair[1];if(sum>15)uncertain=true;answers.push({sum,uncertain});html+='<tr><td>Q'+String(row+1).padStart(2,'0')+'</td><td>'+pair[0]+'</td><td>'+pair[1]+'</td><td><input aria-label="Soma questão '+(row+1)+'" type="number" min="0" max="15" step="1" data-q="'+row+'" value="'+sum+'" style="width:65px"></td><td class="'+(uncertain?'warn':'')+'">'+(uncertain?'Revisar':'Conferir')+'</td></tr>';}html+='</table><p><small>Reconhecimento experimental. Verifique TODAS as somas; nenhuma nota é gravada automaticamente.</small></p>';resultado.innerHTML=html;document.getElementById('enviar').disabled=false;estado.textContent='Confirme e ajuste as somas de 00 a 15 antes de enviar.';};
document.getElementById('enviar').onclick=()=>{const inputs=[...resultado.querySelectorAll('input[data-q]')];if(inputs.length!==10)return;const marks=inputs.map(x=>Number(x.value));if(marks.some(v=>!Number.isInteger(v)||v<0||v>15)){alert('Corrija as respostas: devem ficar entre 00 e 15.');return;}if(!confirm('Conferiu visualmente as 10 respostas? Elas NÃO serão salvas até clicar Salvar no corretor.'))return;localStorage.setItem('pss1_omr_pending',JSON.stringify({turma,num,tipo,marks,timestamp:Date.now()}));location.href='index.html?omr=1';};
</script></body></html>
