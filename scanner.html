<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Leitura óptica PSS — dezenas e unidades</title><style>body{font:16px system-ui;background:#f1f5f9;color:#16243c;max-width:850px;margin:auto;padding:14px}section{background:white;padding:15px;border-radius:12px;margin-bottom:12px}button,input{font:inherit;padding:9px;border-radius:7px}button{background:#1e40af;color:white;border:0;margin:5px}canvas{width:100%;height:auto;touch-action:manipulation;border:1px solid #bbb}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #ddd}select{font:inherit}.warn{color:#a33}small{color:#536174}</style></head><body><h2>Leitor óptico PSS — cartão numérico</h2><section><strong id="aluno"></strong><p>Fotografe o cartão inteiro, incluindo as dez colunas, de frente e com boa luz. Clique em <strong>Ler 20 dígitos</strong>. O leitor encontra os contornos dos quadradinhos automaticamente, sem tocar na tela. Confira os resultados antes de enviar.</p><input type="file" id="foto" accept="image/*" capture="environment"><button id="autoModo">Automático (sem pontos)</button><button id="manualModo">Manual (4 pontos)</button><button id="recomecar">Refazer pontos</button><div id="estado">Selecione uma fotografia.</div></section><section><canvas id="cv"></canvas></section><section><button id="analisar">Ler 20 dígitos</button><div id="resultado"></div><button id="enviar" disabled>Enviar para correção (sem salvar nota)</button></section><script>
const qs=new URLSearchParams(location.search), turma=qs.get('turma'),num=Number(qs.get('num')),tipo=qs.get('tipo');
document.getElementById('aluno').textContent='Turma '+(turma||'?')+' · Nº '+(num||'?')+' · Tipo '+(tipo||'?');
const c=document.getElementById('cv'),cx=c.getContext('2d',{willReadFrequently:true}),foto=document.getElementById('foto'),estado=document.getElementById('estado'),resultado=document.getElementById('resultado');let points=[],answers=null,img=null,autoMode=true;


function draw(){
 if(img)cx.drawImage(img,0,0,c.width,c.height);
}
foto.onchange=()=>{
 const f=foto.files[0];if(!f)return;
 const url=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{
  const scale=Math.min(1,1800/i.width);
  c.width=Math.round(i.width*scale);c.height=Math.round(i.height*scale);
  img=i;answers=null;resultado.innerHTML='';
  document.getElementById('enviar').disabled=true;
  draw();estado.textContent='Imagem carregada. Toque em Ler 20 dígitos.';
  URL.revokeObjectURL(url);
 };
 i.src=url;
};
document.getElementById('autoModo').style.display='none';
document.getElementById('manualModo').style.display='none';
document.getElementById('recomecar').textContent='Reanalisar foto';
document.getElementById('recomecar').onclick=()=>{answers=null;resultado.innerHTML='';document.getElementById('enviar').disabled=true;draw();estado.textContent='Toque em Ler 20 dígitos.';};
function groupNumbers(values,gap){
 const gs=[];let g=[];
 for(const v of values){
  if(g.length && v-g[g.length-1]>gap){gs.push(g);g=[];}
  g.push(v);
 }
 if(g.length)gs.push(g);
 return gs.map(a=>a.reduce((s,n)=>s+n,0)/a.length);
}

function decode(){
 if(!img)throw Error('Selecione a imagem do cartão primeiro.');
 draw();
 const w=c.width,h=c.height,rgba=cx.getImageData(0,0,w,h).data;
 if(w<450||h<450)throw Error('Imagem pequena demais para a leitura.');
 const dark=new Uint8Array(w*h);
 for(let p=0,k=0;p<dark.length;p++,k+=4)
   dark[p]=(rgba[k]*.299+rgba[k+1]*.587+rgba[k+2]*.114)<125?1:0;
 // A borda de cada bloco é uma linha vertical longa. O detector antigo
 // descartava toda a imagem quando 1 ou 2 das 20 linhas não eram percebidas.
 // Agora a periodicidade das 10 colunas permite interpolar bordas ausentes.
 const yStart=Math.floor(h*.44),yEnd=Math.floor(h*.97);
 const sumX=new Uint32Array(w);
 for(let y=yStart;y<yEnd;y++)for(let x=0;x<w;x++)sumX[x]+=dark[y*w+x];
 let maximum=0;
 for(const z of sumX)if(z>maximum)maximum=z;
 const strong=[];
 for(let x=0;x<w;x++)if(sumX[x]>=maximum*.70)strong.push(x);
 const peaks=groupNumbers(strong,Math.max(3,Math.round(w*.002)));
 if(peaks.length<12)throw Error('Não consegui localizar as dez colunas. Deixe a área das respostas inteira na foto.');
 const left=peaks[0],right=peaks[peaks.length-1],span=right-left;
 const smallGaps=[];
 for(let i=1;i<peaks.length;i++){
   const gap=peaks[i]-peaks[i-1];
   if(gap<span/40 && gap>span/300)smallGaps.push(gap);
 }
 smallGaps.sort((a,b)=>a-b);
 if(!smallGaps.length)throw Error('Não consegui estabelecer a largura das colunas.');
 const gap=smallGaps[Math.floor(smallGaps.length/2)];
 const pitch=(span+gap)/10;
 const boxes=Array.from({length:10},(_,q)=>[left+q*pitch,left+q*pitch+pitch-gap]);
 if(pitch<25||boxes.some(([a,b])=>a<0||b>w))throw Error('A imagem não contém o bloco completo das respostas.');
 // Encontrar a borda superior/inferior real na primeira coluna, permitindo
 // pequenos espaços causados pelo antialiasing da imagem ou pela câmera.
 const probeX=Math.max(0,Math.min(w-1,Math.round(left)));
 let bestStart=-1,bestEnd=-1,currentStart=-1,lastDark=-1;
 for(let y=0;y<h;y++){
   if(dark[y*w+probeX]){
     if(currentStart<0)currentStart=y;
     lastDark=y;
   }else if(currentStart>=0 && y-lastDark>2){
     if(lastDark-currentStart>bestEnd-bestStart){bestStart=currentStart;bestEnd=lastDark;}
     currentStart=-1;
   }
 }
 if(currentStart>=0&&lastDark-currentStart>bestEnd-bestStart){bestStart=currentStart;bestEnd=lastDark;}
 if(bestStart<0||bestEnd-bestStart<h*.12)throw Error('Não consegui localizar a altura das colunas.');
 const gridHeight=bestEnd-bestStart;
 const bandStart=Math.max(0,Math.floor(bestStart+gridHeight*.04));
 const bandEnd=Math.min(h,Math.ceil(bestEnd-gridHeight*.02));
 // Os 20 traços horizontais (topo e base dos dez dígitos) se repetem
 // nas 10 colunas. Encontrá-los evita qualquer ajuste manual no celular.
 const bars=[];
 for(let y=bandStart;y<bandEnd;y++){
   let count=0;
   for(const [a,b] of boxes){
     const wd=b-a;
     for(const frac of [.30,.67]){
       const xc=Math.round(a+frac*wd);
       const rad=Math.max(2,Math.round(wd*.09));
       for(let x=Math.max(0,xc-rad);x<=Math.min(w-1,xc+rad);x++)count+=dark[y*w+x];
     }
   }
   bars.push(count);
 }
 const barMax=Math.max(...bars),levels=[.55,.50,.45,.60,.40];
 let horizontal=[];
 for(const level of levels){
   const ys=[];
   for(let i=0;i<bars.length;i++)if(bars[i]>barMax*level)ys.push(i+bandStart);
   horizontal=groupNumbers(ys,Math.max(2,Math.round(h*.001)));
   if(horizontal.length===20)break;
 }
 if(horizontal.length!==20)throw Error('Não foi possível identificar os quadradinhos das respostas. Centralize somente a área das dez colunas.');
 const rows=Array.from({length:10},(_,d)=>(horizontal[2*d]+horizontal[2*d+1])/2);
 const heightCell=horizontal[1]-horizontal[0];
 function density(x,y,rx,ry){
   let black=0,total=0;
   for(let yy=Math.max(0,Math.round(y-ry));yy<=Math.min(h-1,Math.round(y+ry));yy++)
     for(let xx=Math.max(0,Math.round(x-rx));xx<=Math.min(w-1,Math.round(x+rx));xx++){
       black+=dark[yy*w+xx];total++;
     }
   return total?black/total:0;
 }
 const result=[];
 for(let q=0;q<10;q++){
   const [a,b]=boxes[q],wd=b-a;
   const columns=[];
   for(const [frac,limit] of [[.30,2],[.67,10]]){
     const x=a+frac*wd;
     const scores=Array.from({length:limit},(_,d)=>density(x,rows[d],Math.max(2,wd*.07),Math.max(2,heightCell*.26)));
     const sorted=scores.map((value,digit)=>({value,digit})).sort((v,z)=>z.value-v.value);
     columns.push({digit:sorted[0].digit,value:sorted[0].value,margin:sorted[0].value-sorted[1].value,x});
   }
   const value=10*columns[0].digit+columns[1].digit;
   const reliable=value<=15&&columns.every(v=>v.value>.65&&v.margin>.35);
   result.push({value,parsed:columns,reliable});
 }
 draw();
 cx.lineWidth=Math.max(2,w/650);
 for(let q=0;q<10;q++){
   for(let d=0;d<2;d++){
     const z=result[q].parsed[d],y=rows[z.digit],radius=Math.max(3,(boxes[q][1]-boxes[q][0])*.055);
     cx.strokeStyle=result[q].reliable?'#15803d':'#dc2626';
     cx.strokeRect(z.x-radius,y-radius,2*radius,2*radius);
   }
 }
 return result;
}
document.getElementById('analisar').onclick=()=>{
 let out;
 try{out=decode();}catch(e){
  answers=null;
  document.getElementById('enviar').disabled=true;
  resultado.innerHTML='<p class="warn">'+e.message+'</p>';
  estado.textContent='A leitura não foi concluída. Veja a mensagem abaixo.';
  return;
 }
 answers=out;
 let table='<table><tr><th>Questão</th><th>Dezena</th><th>Unidade</th><th>Soma</th><th>Leitura</th></tr>';
 for(let q=0;q<10;q++){
  const r=out[q];
  table+='<tr><td>Q'+String(q+1).padStart(2,'0')+'</td><td>'+r.parsed[0].digit+'</td><td>'+r.parsed[1].digit+'</td><td><input type="number" min="0" max="15" step="1" value="'+r.value+'" data-q="'+q+'" style="width:70px"></td><td class="'+(r.reliable?'':'warn')+'">'+(r.reliable?'Detectado':'Inseguro')+'</td></tr>';
 }
 table+='</table><p><small>Os contornos verdes mostram os quadradinhos analisados. Confira as somas antes de enviar.</small></p>';
 resultado.innerHTML=table;
 const all=out.every(v=>v.reliable);
 document.getElementById('enviar').disabled=!all;
 estado.textContent=all?'Leitura concluída. Confira os dez valores antes de enviar.':'Algumas marcações não foram identificadas com segurança. Faça uma foto mais nítida.';
};
document.getElementById('enviar').onclick=()=>{const inputs=[...resultado.querySelectorAll('input[data-q]')];if(inputs.length!==10)return;const marks=inputs.map(x=>Number(x.value));if(marks.some(v=>!Number.isInteger(v)||v<0||v>15)){alert('Corrija as respostas: devem ficar entre 00 e 15.');return;}if(!confirm('Conferiu visualmente as 10 respostas? Elas NÃO serão salvas até clicar Salvar no corretor.'))return;localStorage.setItem('pss1_omr_pending',JSON.stringify({turma,num,tipo,marks,timestamp:Date.now()}));location.href='index.html?omr=1';};
</script></body></html>
