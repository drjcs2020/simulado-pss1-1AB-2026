<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Leitura óptica PSS — dezenas e unidades</title><style>body{font:16px system-ui;background:#f1f5f9;color:#16243c;max-width:850px;margin:auto;padding:14px}section{background:white;padding:15px;border-radius:12px;margin-bottom:12px}button,input{font:inherit;padding:9px;border-radius:7px}button{background:#1e40af;color:white;border:0;margin:5px}canvas{width:100%;height:auto;touch-action:manipulation;border:1px solid #bbb}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #ddd}select{font:inherit}.warn{color:#a33}small{color:#536174}</style></head><body><h2>Leitor óptico PSS — cartão numérico</h2><section><strong id="aluno"></strong><p>Fotografe a área de respostas com as dez colunas completas. Toque em <strong>Ler 20 dígitos</strong>. O leitor encontra os dez retângulos automaticamente, sem precisar marcar cantos com o dedo.</p><input type="file" id="foto" accept="image/*" capture="environment"><button id="autoModo">Automático (sem pontos)</button><button id="manualModo">Manual (4 pontos)</button><button id="recomecar">Refazer pontos</button><div id="estado">Selecione uma fotografia.</div></section><section><canvas id="cv"></canvas></section><section><button id="analisar">Ler 20 dígitos</button><div id="resultado"></div><button id="enviar" disabled>Enviar para correção (sem salvar nota)</button></section><script>
const qs=new URLSearchParams(location.search), turma=qs.get('turma'),num=Number(qs.get('num')),tipo=qs.get('tipo');
document.getElementById('aluno').textContent='Turma '+(turma||'?')+' · Nº '+(num||'?')+' · Tipo '+(tipo||'?');
const c=document.getElementById('cv'),cx=c.getContext('2d',{willReadFrequently:true}),foto=document.getElementById('foto'),estado=document.getElementById('estado'),resultado=document.getElementById('resultado');let points=[],answers=null,img=null,autoMode=true;



let cornerMode='auto',corners=[],imagePixels=null;
const cornerNames=['superior esquerdo','superior direito','inferior direito','inferior esquerdo'];
document.getElementById('autoModo').style.display='';
document.getElementById('manualModo').style.display='';
document.getElementById('autoModo').textContent='Alinhar automaticamente';
document.getElementById('manualModo').textContent='Ajustar quatro cantos';
document.getElementById('recomecar').textContent='Recomeçar';
function readPixels(){
 cx.drawImage(img,0,0,c.width,c.height);
 imagePixels=cx.getImageData(0,0,c.width,c.height);
}
function draw(){
 if(!img)return;
 cx.drawImage(img,0,0,c.width,c.height);
 cx.lineWidth=Math.max(2,c.width/600);
 corners.forEach((p,i)=>{
  cx.strokeStyle='#e11d48';cx.beginPath();cx.arc(p.x,p.y,Math.max(5,c.width/170),0,Math.PI*2);cx.stroke();
  cx.font=Math.max(14,c.width/45)+'px sans-serif';cx.fillStyle='#e11d48';
  cx.fillText(''+(i+1),p.x+7,p.y-6);
 });
 if(corners.length===4){
  cx.strokeStyle='#16a34a';cx.beginPath();cx.moveTo(corners[0].x,corners[0].y);
  for(let i=1;i<4;i++)cx.lineTo(corners[i].x,corners[i].y);
  cx.closePath();cx.stroke();
 }
}
function markStatus(t){estado.textContent=t}
foto.onchange=()=>{
 const file=foto.files[0];if(!file)return;
 const url=URL.createObjectURL(file),loaded=new Image();
 loaded.onload=()=>{
  const scale=Math.min(1,1800/loaded.width);
  c.width=Math.round(loaded.width*scale);c.height=Math.round(loaded.height*scale);
  img=loaded;corners=[];answers=null;resultado.innerHTML='';
  document.getElementById('enviar').disabled=true;
  readPixels();URL.revokeObjectURL(url);
  try{corners=detectCorners();markStatus('Quatro cantos encontrados automaticamente. Toque em Ler 20 dígitos.');}
  catch(e){cornerMode='manual';markStatus('Não foi possível alinhar automaticamente. Toque em Ajustar quatro cantos e marque os cantos externos da grade.');}
  draw();
 };
 loaded.src=url;
};
function darkAt(x,y){
 x=Math.round(x);y=Math.round(y);
 if(x<0||y<0||x>=c.width||y>=c.height)return 0;
 const k=(y*c.width+x)*4,p=imagePixels.data;
 return p[k]*.299+p[k+1]*.587+p[k+2]*.114 < 130 ? 1:0;
}

function decodeImageData(imageData) {
 const w=imageData.width,h=imageData.height,rgba=imageData.data,n=w*h;
 const bw=new Uint8Array(n),seen=new Uint8Array(n),queue=new Int32Array(n);
 for(let i=0,j=0;i<n;i++,j+=4)bw[i]=rgba[j]*.299+rgba[j+1]*.587+rgba[j+2]*.114<150?1:0;
 const candidates=[];
 for(let index=0;index<n;index++){
  if(!bw[index]||seen[index])continue;
  let head=0,tail=1;queue[0]=index;seen[index]=1;
  let minX=w,maxX=0,minY=h,maxY=0,area=0;
  while(head<tail){
   const p=queue[head++],y=(p/w)|0,x=p-y*w;area++;
   if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
   for(let dy=-1;dy<=1;dy++){
    const ny=y+dy;if(ny<0||ny>=h)continue;
    for(let dx=-1;dx<=1;dx++){
     const nx=x+dx;if(nx<0||nx>=w)continue;
     const z=ny*w+nx;
     if(bw[z]&&!seen[z]){seen[z]=1;queue[tail++]=z;}
    }
   }
  }
  const ww=maxX-minX+1,hh=maxY-minY+1;
  if(ww>.028*w&&ww<.16*w&&hh>.10*h&&hh<.72*h&&minY>.10*h&&hh/ww>2&&area>ww*hh*.007)
   candidates.push({x:minX,y:minY,w:ww,h:hh,area});
 }
 const blocks=candidates.sort((a,b)=>a.x-b.x);
 if(blocks.length!==10)return {error:'Encontrei '+blocks.length+' blocos de respostas; são necessários dez. Fotografe as colunas 01 a 10 de frente, com a grade inteira.',blocks};
 const heights=blocks.map(b=>b.h).sort((a,b)=>a-b),medianH=heights[5];
 const widths=blocks.map(b=>b.w).sort((a,b)=>a-b),medianW=widths[5];
 if(blocks.some(b=>Math.abs(b.h-medianH)>medianH*.17||Math.abs(b.w-medianW)>medianW*.20))
  return {error:'As colunas estão inclinadas ou com distorção excessiva para corrigir com segurança.',blocks};
 const results=[];
 for(let q=0;q<10;q++){
  const b=blocks[q],cols=[];
  for(const [fx,num] of [[.329,2],[.673,10]]){
   const scores=[];
   for(let d=0;d<num;d++){
    const cx0=Math.round(b.x+b.w*fx),cy=Math.round(b.y+b.h*(.149+.0855*d));
    const rx=Math.max(2,Math.round(b.w*.055)),ry=Math.max(2,Math.round(b.h*.016));
    let black=0,total=0;
    for(let y=Math.max(0,cy-ry);y<=Math.min(h-1,cy+ry);y++)
     for(let x=Math.max(0,cx0-rx);x<=Math.min(w-1,cx0+rx);x++){
      black+=bw[y*w+x];total++;
     }
    scores.push(black/total);
   }
   const sorted=scores.map((score,digit)=>({score,digit})).sort((a,b)=>b.score-a.score);
   cols.push({digit:sorted[0].digit,score:sorted[0].score,margin:sorted[0].score-sorted[1].score,fx});
  }
  const value=10*cols[0].digit+cols[1].digit;
  results.push({value,cols,reliable:value<=15&&cols.every(z=>z.score>.65&&z.margin>.35),box:b});
 }
 return {results,blocks};
}
function draw(){
 if(!img)return;
 cx.drawImage(img,0,0,c.width,c.height);
}
foto.onchange=()=>{
 const f=foto.files[0];if(!f)return;
 const url=URL.createObjectURL(f),loaded=new Image();
 loaded.onload=()=>{
  const scale=Math.min(1,1100/loaded.width);
  c.width=Math.round(loaded.width*scale);c.height=Math.round(loaded.height*scale);
  img=loaded;answers=null;resultado.innerHTML='';
  document.getElementById('enviar').disabled=true;
  draw();estado.textContent='Imagem carregada. Toque em Ler 20 dígitos.';
  URL.revokeObjectURL(url);
 };
 loaded.src=url;
};
document.getElementById('autoModo').style.display='none';
document.getElementById('manualModo').style.display='none';
document.getElementById('recomecar').textContent='Reanalisar';
document.getElementById('recomecar').onclick=()=>{
 answers=null;resultado.innerHTML='';document.getElementById('enviar').disabled=true;
 draw();estado.textContent='Toque em Ler 20 dígitos.';
};
c.onclick=()=>{};
document.getElementById('analisar').onclick=()=>{
 if(!img){estado.textContent='Selecione a imagem do cartão primeiro.';return;}
 draw();
 const result=decodeImageData(cx.getImageData(0,0,c.width,c.height));
 if(result.error){
  answers=null;document.getElementById('enviar').disabled=true;
  resultado.textContent=result.error;
  estado.textContent='Não foi possível confirmar a grade.';
  return;
 }
 answers=result.results;
 draw();
 cx.strokeStyle='#16a34a';cx.lineWidth=Math.max(2,c.width/550);
 result.blocks.forEach(b=>cx.strokeRect(b.x,b.y,b.w,b.h));
 const all=answers.every(a=>a.reliable);
 let table='<table><tr><th>Questão</th><th>Dezena</th><th>Unidade</th><th>Soma</th><th>Leitura</th></tr>';
 answers.forEach((r,i)=>{
  table+='<tr><td>Q'+String(i+1).padStart(2,'0')+'</td><td>'+r.cols[0].digit+'</td><td>'+r.cols[1].digit+'</td><td><input type="number" data-q="'+i+'" min="0" max="15" step="1" value="'+r.value+'" style="width:65px"></td><td class="'+(r.reliable?'':'warn')+'">'+(r.reliable?'Detectado':'Revisar')+'</td></tr>';
 });
 table+='</table><p><small>As bordas verdes mostram as dez colunas detectadas. Compare os valores com o cartão antes de salvar.</small></p>';
 resultado.innerHTML=table;
 document.getElementById('enviar').disabled=!all;
 estado.textContent=all?'Dez respostas reconhecidas. Confira antes de enviar.':'Há marcações incertas. Faça uma foto mais nítida.';
};
document.getElementById('enviar').onclick=()=>{const inputs=[...resultado.querySelectorAll('input[data-q]')];if(inputs.length!==10)return;const marks=inputs.map(x=>Number(x.value));if(marks.some(v=>!Number.isInteger(v)||v<0||v>15)){alert('Corrija as respostas: devem ficar entre 00 e 15.');return;}if(!confirm('Conferiu visualmente as 10 respostas? Elas NÃO serão salvas até clicar Salvar no corretor.'))return;localStorage.setItem('pss1_omr_pending',JSON.stringify({turma,num,tipo,marks,timestamp:Date.now()}));location.href='index.html?omr=1';};
</script></body></html>
