<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b75"><title>Leitor de cartão PSS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px system-ui,-apple-system,sans-serif;color:#10243e;background:#eff3f8}button{font:inherit;border:0;border-radius:10px;padding:13px 15px;background:#1b447f;color:white;font-weight:700;touch-action:manipulation;cursor:pointer}button:disabled{opacity:.45}button.secondary{background:#e8eef8;color:#143b71}button.good{background:#13764a}header{padding:10px 14px;background:white;border-bottom:1px solid #dbe3ee;display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:17px;margin:0}#student{font-size:12px;color:#546a83;margin-top:4px}.headerback{background:#eef2f8;color:#1e3a65;padding:9px 14px}.toolbar{display:flex;gap:8px;padding:9px 12px;background:white}.toolbar button,.toolbar label{flex:1;min-width:0}.filelabel{border:1px solid #afc0d4;border-radius:9px;background:#f1f6fc;padding:9px;text-align:center;font-weight:700;color:#1c426f;cursor:pointer}.filelabel input{display:none}.message{font-size:13px;padding:6px 12px;color:#35516c;background:white;min-height:27px}#viewport{position:relative;background:#060b14;overflow:hidden;height:63dvh;min-height:340px;display:flex;justify-content:center;align-items:center}#viewport video,#viewport canvas{display:none;max-width:100%;max-height:100%;object-fit:contain}#viewport.mode-live video{display:block;width:100%;height:100%}#viewport.mode-live canvas#overlay{display:block;position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#viewport.mode-photo canvas#snapshot{display:block;width:100%;height:100%;touch-action:manipulation}.capture-controls{display:none}body.camera-active header,body.camera-active .toolbar,body.camera-active #answersPanel,body.camera-active #status{display:none}body.camera-active #viewport{position:fixed;inset:0;height:100dvh;width:100vw;z-index:20;border-radius:0}body.camera-active .capture-controls{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;gap:12px;justify-content:center;align-items:center;padding:14px 14px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.83));color:white}body.camera-active .capture-controls button{background:#fff;color:#133760}body.camera-active #capture{border-radius:50%;width:76px;height:76px;flex:none;border:6px solid #ffffff6b;background:white;font-size:13px}body.camera-active #cancelCamera{width:76px;flex:none;background:#24374be0;color:white}body.camera-active #cameraSpacer{width:76px;flex:none}#answersPanel{padding:12px;max-width:980px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.answer{border:1px solid #d1dcec;border-radius:11px;padding:9px 5px;background:white}.answer.missing{background:#fff6ea}.answer .marks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin-top:7px}.answer button.mark{border:1px solid #9baec8;padding:9px 0;min-width:0;border-radius:6px;background:white;color:#183c65;font-size:12px;font-weight:800}.answer button.mark.selected{background:#16477c;color:white;border-color:#16477c}.answer .sum{text-align:center;font-weight:800;font-size:19px;margin-top:7px}.actionrow{display:flex;gap:8px;margin:12px 0}.actionrow>*{flex:1}.assist{font-size:12px;color:#536882;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.answer button.mark{padding:12px 0}#viewport{height:55dvh;min-height:330px}}@media(max-width:350px){.answer button.mark{font-size:11px}}
</style></head>
<body>
<header><div><h1>Leitor de cartão</h1><div id="student"></div></div><button class="headerback" id="back" type="button">Voltar</button></header>
<div class="toolbar"><button id="open" type="button">Abrir câmera</button><label for="file" class="filelabel">Escolher imagem<input id="file" type="file" accept="image/*"></label></div>
<div id="status" class="message" role="status">Preparando câmera…</div>
<div id="viewport"><video id="video" autoplay muted playsinline webkit-playsinline></video><canvas id="overlay"></canvas><canvas id="snapshot" width="800" height="600"></canvas></div>
<div class="capture-controls"><button type="button" id="cancelCamera">Voltar</button><button type="button" id="capture">Capturar</button><div id="cameraSpacer"></div></div>
<section id="answersPanel"><div class="actionrow"><button id="analyze" class="secondary" type="button">Ler marcações</button><button id="retake" class="secondary" type="button">Nova captura</button></div>
<div id="answers" class="grid"></div><div class="assist">Confira e corrija tocando em 01, 02, 04 ou 08. Sem digitação.</div>
<div class="actionrow"><button id="send" class="good" type="button" disabled>Usar respostas</button></div></section>
<script>
"use strict";
const params=new URLSearchParams(location.search),turma=params.get('turma')||'',num=Number(params.get('num')),tipo=params.get('tipo')||'';
const $=id=>document.getElementById(id);
const video=$('video'),snapshot=$('snapshot'),ctx=snapshot.getContext('2d',{willReadFrequently:true}),overlay=$('overlay'),overlayCtx=overlay.getContext('2d'),viewport=$('viewport');
const state={stream:null,loading:false,cv:null,cvPromise:null,frame:null,analysisCanvas:document.createElement('canvas'),frozen:false,source:null,result:null,marks:Array(10).fill(null),recognizing:false};
$('student').textContent='Turma '+turma+' · Nº '+String(num).padStart(2,'0')+' · Tipo '+tipo;
function message(t){$('status').textContent=t}
function updateSend(){$('send').disabled=state.marks.some(x=>!Number.isInteger(x)||x<0||x>15)||!['1A','1B'].includes(turma)||!['A','B','C'].includes(tipo)||!Number.isInteger(num)||num<1}
function renderInputs(){
 const root=$('answers');root.replaceChildren();
 for(let q=0;q<10;q++){
  const box=document.createElement('div');box.className='answer'+(state.marks[q]===null?' missing':'');
  const title=document.createElement('div');title.style.textAlign='center';title.style.fontWeight='700';title.textContent='Q'+String(q+1).padStart(2,'0');
  const buttons=document.createElement('div');buttons.className='marks';
  for(const bit of [1,2,4,8]){
   const button=document.createElement('button');button.type='button';button.className='mark'+(state.marks[q]!==null&&(state.marks[q]&bit)?' selected':'');
   button.textContent=String(bit).padStart(2,'0');button.setAttribute('aria-pressed',Boolean(state.marks[q]!==null&&(state.marks[q]&bit)));
   button.onclick=()=>{
    if(state.marks[q]===null)state.marks[q]=0;
    state.marks[q]^=bit;
    renderInputs();if(state.frozen&&state.result)drawBoxes(state.result,true);
   };
   buttons.append(button);
  }
  const sum=document.createElement('div');sum.className='sum';sum.textContent=state.marks[q]===null?'—':String(state.marks[q]).padStart(2,'0');
  const zero=document.createElement('button');zero.type='button';zero.className='mark';zero.textContent='00 / limpar';zero.style.width='100%';zero.style.marginTop='5px';
  zero.onclick=()=>{state.marks[q]=0;renderInputs();if(state.frozen&&state.result)drawBoxes(state.result,true)};
  box.append(title,buttons,sum,zero);root.append(box);
 }updateSend();
}
function applyRead(values){state.marks=values.slice();renderInputs();}
function closeCamera(){
 if(state.frame!==null){clearTimeout(state.frame);state.frame=null}
 if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null}
 video.pause();video.srcObject=null;
}
function dimensions(source){
 const w=source.videoWidth||source.naturalWidth||source.width;
 const h=source.videoHeight||source.naturalHeight||source.height;
 return w&&h?{w,h}:null;
}
function drawSnapshot(source){
 const d=dimensions(source);if(!d)return false;
 const k=Math.min(1,1200/d.w);snapshot.width=Math.round(d.w*k);snapshot.height=Math.round(d.h*k);
 ctx.drawImage(source,0,0,snapshot.width,snapshot.height);return true;
}
function drawBoxes(result,fromMarks=false){
 overlayCtx.clearRect(0,0,overlay.width,overlay.height);
 const target=state.frozen?ctx:overlayCtx;
 if(state.frozen&&state.source)drawSnapshot(state.source);
 if(!result||!result.boxes||result.boxes.length!==10)return;
 target.lineWidth=Math.max(2,(state.frozen?snapshot.width:overlay.width)/550);
 function point(q,u,v){
  if(!q)return null;
  return {x:(1-u)*(1-v)*q[0].x+u*(1-v)*q[1].x+u*v*q[2].x+(1-u)*v*q[3].x,
          y:(1-u)*(1-v)*q[0].y+u*(1-v)*q[1].y+u*v*q[2].y+(1-u)*v*q[3].y};
 }
 function strokePolygon(points){
  target.beginPath();points.forEach((p,i)=>i?target.lineTo(p.x,p.y):target.moveTo(p.x,p.y));target.closePath();target.stroke();
 }
 result.boxes.forEach((b,q)=>{
  const value=fromMarks?state.marks[q]:(result.results[q]?.valid?result.results[q].value:null);
  target.strokeStyle=value===null?'#f59e0b':'#16c784';
  if(b.quad)strokePolygon(b.quad);
  else target.strokeRect(b.x,b.y,b.w,b.h);
  if(value===null)return;
  [[.329,Math.floor(value/10)],[.673,value%10]].forEach(([u,digit])=>{
   const v=.149+.0855*digit;
   if(b.quad)strokePolygon([point(b.quad,u-.058,v-.02),point(b.quad,u+.058,v-.02),point(b.quad,u+.058,v+.02),point(b.quad,u-.058,v+.02)]);
   else{const x=b.x+b.w*u,y=b.y+b.h*v;target.strokeRect(x-b.w*.06,y-b.h*.02,b.w*.12,b.h*.04)}
  });
 });
}
function loadCv(){
 if(state.cv)return Promise.resolve(state.cv);
 if(state.cvPromise)return state.cvPromise;
 state.cvPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.async=true;script.src='https://docs.opencv.org/4.13.0/opencv.js';
  let finished=false;
  const fail=why=>{if(finished)return;finished=true;state.cvPromise=null;reject(Error(why))};
  const timeout=setTimeout(()=>fail('Biblioteca de leitura indisponível.'),9000);
  script.onerror=()=>{clearTimeout(timeout);fail('Não foi possível carregar o leitor óptico.')};
  script.onload=async()=>{
   try{const cv=await window.cv;if(!cv||typeof cv.imread!=='function')throw Error('Leitor óptico não inicializou.');
    if(finished)return;finished=true;clearTimeout(timeout);state.cv=cv;resolve(cv);
   }catch(e){clearTimeout(timeout);fail(String(e.message||e))}
  };
  document.head.append(script);
 });
 return state.cvPromise;
}
function quadSorted(points){
 const center={x:points.reduce((a,p)=>a+p.x,0)/4,y:points.reduce((a,p)=>a+p.y,0)/4};
 const sorted=points.slice().sort((a,b)=>Math.atan2(a.y-center.y,a.x-center.x)-Math.atan2(b.y-center.y,b.x-center.x));
 let first=0;for(let i=1;i<4;i++)if(sorted[i].x+sorted[i].y<sorted[first].x+sorted[first].y)first=i;
 return Array.from({length:4},(_,i)=>sorted[(first+i)%4]);
}
function readImage(lib,sourceCanvas){
 const src=lib.imread(sourceCanvas),gray=new lib.Mat(),bw=new lib.Mat(),contours=new lib.MatVector(),hierarchy=new lib.Mat();
 try{
  lib.cvtColor(src,gray,lib.COLOR_RGBA2GRAY);
  lib.threshold(gray,bw,0,255,lib.THRESH_BINARY_INV|lib.THRESH_OTSU);
  lib.findContours(bw,contours,hierarchy,lib.RETR_LIST,lib.CHAIN_APPROX_SIMPLE);
  const w=bw.cols,h=bw.rows,candidates=[];
  for(let i=0;i<contours.size();i++){
   const contour=contours.get(i);
   try{
    const b=lib.boundingRect(contour),ratio=b.height/b.width;
    if(b.width>.023*w&&b.width<.16*w&&b.height>.11*h&&b.height<.77*h&&ratio>1.8&&b.y>.07*h){
     const rotated=lib.minAreaRect(contour);
     const q=quadSorted(lib.RotatedRect.points(rotated));
     candidates.push({x:b.x,y:b.y,w:b.width,h:b.height,area:b.width*b.height,quad:q});
    }
   }finally{contour.delete()}
  }
  const distinct=[];
  for(const b of candidates.sort((a,b)=>b.area-a.area)){
   const cx=b.x+b.w/2,cy=b.y+b.h/2;
   if(distinct.some(z=>Math.abs(z.x+z.w/2-cx)<Math.min(z.w,b.w)*.30&&Math.abs(z.y+z.h/2-cy)<Math.min(z.h,b.h)*.30))continue;
   distinct.push(b);
  }
  let boxes=[];
  for(const anchor of distinct){
   const set=distinct.filter(b=>{
    const dx=(b.x+b.w/2)-(anchor.x+anchor.w/2);
    const dy=(b.y+b.h/2)-(anchor.y+anchor.h/2);
    return Math.abs(b.h-anchor.h)<anchor.h*.27&&
           Math.abs(b.w-anchor.w)<anchor.w*.35&&
           Math.abs(dy)<Math.abs(dx)*.29+anchor.h*.09;
   }).sort((a,b)=>a.x-b.x);
   for(let off=0;off<=set.length-10;off++){
    const seq=set.slice(off,off+10),xs=seq.map(b=>b.x+b.w/2),ys=seq.map(b=>b.y+b.h/2);
    const gaps=xs.slice(1).map((x,i)=>x-xs[i]),avg=gaps.reduce((a,b)=>a+b,0)/9;
    if(avg<=0||gaps.some(v=>Math.abs(v-avg)>avg*.30))continue;
    const slope=(ys[9]-ys[0])/(xs[9]-xs[0]);
    if(Math.abs(slope)>.28||ys.some((y,i)=>Math.abs(y-(ys[0]+slope*(xs[i]-xs[0])))>seq[0].h*.13))continue;
    if(!boxes.length||seq.reduce((a,b)=>a+b.area,0)>boxes.reduce((a,b)=>a+b.area,0))boxes=seq;
   }
  }
  if(boxes.length!==10)return {error:'As dez colunas não foram reconhecidas com segurança.',boxes:[],results:[]};
  boxes.sort((a,b)=>a.x-b.x);
  const dst=lib.matFromArray(4,1,lib.CV_32FC2,[0,0,103,0,103,370,0,370]);
  const results=[];
  try{
   for(const box of boxes){
    const coords=box.quad.flatMap(p=>[p.x,p.y]);
    const sourcePoints=lib.matFromArray(4,1,lib.CV_32FC2,coords);
    const warped=new lib.Mat();let transform=null;
    try{
     transform=lib.getPerspectiveTransform(sourcePoints,dst);
     lib.warpPerspective(bw,warped,transform,new lib.Size(104,371),lib.INTER_LINEAR,lib.BORDER_CONSTANT,new lib.Scalar(0));
     const data=warped.data,rw=warped.cols,rh=warped.rows;
     function density(cx,cy,rx,ry){
      let sum=0,n=0;
      for(let y=Math.max(0,Math.round(cy-ry));y<=Math.min(rh-1,Math.round(cy+ry));y++)
       for(let x=Math.max(0,Math.round(cx-rx));x<=Math.min(rw-1,Math.round(cx+rx));x++){
        sum+=data[y*rw+x]>128?1:0;n++;
       }
      return n?sum/n:0;
     }
     const columns=[];
     for(const [frac,maxDigit] of [[.329,2],[.673,10]]){
      const scores=[];
      for(let d=0;d<maxDigit;d++){
       scores.push({digit:d,value:density(103*frac,370*(.149+.0855*d),5.5,6)});
      }
      scores.sort((a,b)=>b.value-a.value);
      const confident=scores[0].value>.58&&(scores[0].value-scores[1].value)>.25;
      columns.push({digit:confident?scores[0].digit:null,candidate:scores[0].digit,confidence:scores[0].value-scores[1].value});
     }
     const value=columns.every(z=>z.digit!==null)?columns[0].digit*10+columns[1].digit:null;
     results.push({columns,value,valid:value!==null&&value>=0&&value<=15});
    }finally{sourcePoints.delete();warped.delete();if(transform)transform.delete()}
   }
  }finally{dst.delete()}
  return {boxes,results};
 }finally{src.delete();gray.delete();bw.delete();contours.delete();hierarchy.delete()}
}
async function detectFromCanvas(sourceCanvas){
 if(state.recognizing)return null;
 state.recognizing=true;
 try{const lib=await loadCv();return readImage(lib,sourceCanvas)}
 finally{state.recognizing=false}
}
function showSource(){viewport.classList.toggle('mode-live',!!state.stream);viewport.classList.toggle('mode-photo',state.frozen);document.body.classList.toggle('camera-active',!!state.stream&&!state.frozen)}
function liveLoop(){
 if(!state.stream||state.frozen)return;
 const d=dimensions(video);
 if(d&&!state.recognizing){
  const scale=Math.min(1,640/d.w),w=Math.round(d.w*scale),h=Math.round(d.h*scale);
  if(overlay.width!==w||overlay.height!==h){overlay.width=w;overlay.height=h}
  overlayCtx.clearRect(0,0,w,h);
  state.analysisCanvas.width=w;state.analysisCanvas.height=h;
  state.analysisCanvas.getContext('2d',{willReadFrequently:true}).drawImage(video,0,0,w,h);
  if(state.cv){
   try{const result=readImage(state.cv,state.analysisCanvas);if(!result.error){state.result=result;drawBoxes(result,false)}else state.result=null}
   catch(e){state.result=null}
  }
 }
 state.frame=setTimeout(liveLoop,1800);
}
async function openCamera(){
 if(state.loading)return;
 state.loading=true;$('open').disabled=true;
 closeCamera();state.frozen=false;state.result=null;state.source=null;
 try{
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('A câmera exige uma página HTTPS e permissão do navegador.');
  message('Solicitando acesso à câmera…');
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}})}
  catch(e){if(['NotFoundError','OverconstrainedError'].includes(e.name))stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});else throw e}
  state.stream=stream;video.srcObject=stream;
  await video.play();state.frozen=false;showSource();
  message('Câmera pronta.');
  liveLoop();
  // Reconhecimento separado da abertura de câmera.
  loadCv().catch(()=>{if(state.stream)message('Câmera aberta. Capture para revisar pelas proposições.')});
 }catch(e){
  closeCamera();showSource();
  const msg=e.name==='NotAllowedError'?'Permissão negada. Autorize a câmera para este site.':e.name==='NotReadableError'?'Câmera ocupada por outro aplicativo.':String(e.message||e);
  message('Não foi possível abrir a câmera: '+msg+'. Você pode escolher uma imagem.');
 }finally{state.loading=false;$('open').disabled=false}
}
$('open').onclick=openCamera;
$('capture').onclick=async()=>{
 if(!state.stream||!dimensions(video)){message('A câmera ainda não está pronta.');return}
 // Capturar imediatamente o quadro atual, sem esperar OpenCV nem conversão por DataURL.
 try{
  if(!drawSnapshot(video))throw Error('Não foi possível capturar a imagem.');
  const frame=document.createElement('canvas');frame.width=snapshot.width;frame.height=snapshot.height;
  frame.getContext('2d').drawImage(snapshot,0,0);
  state.source=frame;state.frozen=true;state.result=null;
  closeCamera();showSource();drawSnapshot(state.source);
  message('Imagem capturada. Confira as marcações.');
  if(state.cv){
   try{const result=readImage(state.cv,snapshot);
    if(!result.error){state.result=result;applyRead(result.results.map(r=>r.valid?r.value:null));drawBoxes(result,true)}
    else message('Imagem capturada. Se a leitura falhar, corrija pelas proposições.');
   }catch(err){message('Imagem capturada. Corrija pelas proposições.')}
  }else {
   // A imagem foi capturada; a análise óptica pode carregar depois, sem congelar a tela.
   loadCv().then(async()=>{$('analyze').click()}).catch(()=>{});
  }
 }catch(e){message('Falha na captura: '+String(e.message||e))}
};
$('cancelCamera').onclick=()=>{closeCamera();state.frozen=false;showSource();message('Câmera fechada.')};
$('retake').onclick=()=>openCamera();
$('file').onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 closeCamera();state.frozen=true;state.result=null;showSource();
 const url=URL.createObjectURL(f),img=new Image();
 try{
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
  state.source=img;drawSnapshot(img);
  if(state.cv){
   try{
    const found=readImage(state.cv,snapshot);
    if(!found.error){
     state.result=found;applyRead(found.results.map(r=>r.valid?r.value:null));drawBoxes(found,true);
     message('Imagem carregada e analisada. Confira os quadradinhos.'); 
    }else message('Imagem carregada. Marque as proposições abaixo ou toque em Ler marcações.');
   }catch(e){message('Imagem carregada. Use os botões 01, 02, 04 e 08.')}
  }else message('Imagem carregada. Marque as proposições ou toque em Ler marcações da imagem.');
 }catch(err){message('Falha ao abrir a imagem: '+String(err.message||err))}
 finally{URL.revokeObjectURL(url)}
};
$('analyze').onclick=async()=>{
 if(!state.frozen||!state.source){message('Congele a câmera ou escolha uma imagem antes de analisar.');return}
 if(!drawSnapshot(state.source))return;
 message('Analisando imagem…');
 try{
  const found=await detectFromCanvas(snapshot);
  if(!found)return;
  if(found.error){state.result=null;message('Não foi possível identificar as dez colunas. Marque as proposições manualmente abaixo.');return}
  state.result=found;applyRead(found.results.map(r=>r.valid?r.value:null));
  drawBoxes(found,true);
  message('Leitura realizada. Confira e corrija as dez somatórias antes de enviar.');
 }catch(err){message('Leitura automática indisponível: '+String(err.message||err)+'. Use os quadradinhos abaixo.')}
};
snapshot.addEventListener('pointerdown',e=>{
 if(!state.frozen||!state.result||state.result.boxes.length!==10)return;
 const rect=snapshot.getBoundingClientRect(),x=(e.clientX-rect.left)*snapshot.width/rect.width,y=(e.clientY-rect.top)*snapshot.height/rect.height;
 for(let q=0;q<10;q++){
  const b=state.result.boxes[q];
  if(x<b.x||x>b.x+b.w||y<b.y||y>b.y+b.h)continue;
  const digit=Math.round(((y-b.y)/b.h-.149)/.0855),tens=(x-b.x)/b.w<.5;
  if(digit<0||digit>9||(tens&&digit>1))return;
  const prev=state.marks[q]??0,v=tens?digit*10+prev%10:Math.floor(prev/10)*10+digit;
  if(v>15){message('Somatória máxima é 15. Escolha outro quadradinho.');return}
  state.marks[q]=v;renderInputs();drawBoxes(state.result,true);
  message('Q'+String(q+1).padStart(2,'0')+' alterada para '+String(v).padStart(2,'0')+'.');
  return;
 }
});
$('send').onclick=()=>{
 if($('send').disabled)return;
 if(!confirm('Confirmar as dez somatórias do aluno '+num+', turma '+turma+'?'))return;
 try{localStorage.setItem('pss1_omr_pending',JSON.stringify({turma,num,tipo,marks:state.marks.slice(),source:'camera-or-image',timestamp:Date.now()}));closeCamera();location.href='index.html?omr=1'}
 catch(e){message('Não foi possível guardar as respostas: '+String(e.message||e))}
};
$('back').onclick=()=>{closeCamera();location.href='index.html'};
window.addEventListener('pagehide',closeCamera);
renderInputs();showSource();
