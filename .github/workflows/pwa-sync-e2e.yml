name: PSS1 Install and Google Sheets delivery tests
on:
  push:
    paths:
      - 'index.html'
      - 'scanner.html'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'tests/browser-pwa-sync.e2e.cjs'
      - '.github/workflows/pwa-sync-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-protection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test driver
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install chromium
      - name: Verify PWA and resilient Google Sheets delivery
        run: node tests/browser-pwa-sync.e2e.cjs
