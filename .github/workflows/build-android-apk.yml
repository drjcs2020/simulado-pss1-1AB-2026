name: Build PSS1 Android APK
on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub runner já oferece Android SDK; evita aceitação interativa de licenças.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
      - name: Build APK (ARM64 phones only)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PSS1-Android-Debug
          path: android-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
