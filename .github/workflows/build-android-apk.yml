name: Build PSS1 Android APK
on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub runner já oferece Android SDK; evita aceitação interativa de licenças.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JS bundle before Gradle
        run: npx expo export --platform android --output-dir /tmp/pss1-js-preflight
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK with embedded JS (ARM64)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      - name: Verify embedded JavaScript bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          echo "Release APK includes assets/index.android.bundle"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PSS1-Android-Release
          path: android-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
