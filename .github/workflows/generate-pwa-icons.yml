name: PSS1 Generate installable app icons
on:
  push:
    paths:
      - 'icons/corretor-pss1.svg'
      - '.github/workflows/generate-pwa-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate PNG from PSS1 vector icon
        run: |
          python3 -m pip install --disable-pip-version-check cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          root=Path('icons')
          source=(root/'corretor-pss1.svg').read_bytes()
          for size in (192,512):
              target=root/f'corretor-{size}.png'
              cairosvg.svg2png(bytestring=source,write_to=str(target),output_width=size,output_height=size)
              assert target.stat().st_size > 1000
              print(f'Icon {size}x{size}: {target.stat().st_size} bytes')
          PY
      - name: Commit installable PNG icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/corretor-192.png icons/corretor-512.png
          if git diff --cached --quiet; then
            echo 'Icons are unchanged'
          else
            git commit -m "Gerar ícones PNG para instalação PWA do Corretor PSS1"
            git push
          fi
